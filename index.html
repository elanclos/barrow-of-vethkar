      if(!S.fight) ev.push(R.pick([{t:"noise"},{t:"scrape", vs:a, dmg:R.d(4)}]));
    } else if(!o.yes && !c.ok){
      if(!S.fight) ev.push(R.pick([{t:"scrape", vs:a, dmg:R.d(6)},{t:"noise"}]));
    }
    return ev;
  }
};

/* -------------------------------------------------------------- events --- */
function apply(events){
  for(const e of events){
    switch(e.t){
      case "mturn":
        // swingTok is unique across the whole run, so a new fight's first
        // swing never looks like one already drawn.
        if(S.fight){ S.swingSeq=(S.swingSeq||0)+1; S.fight.swingTok=S.swingSeq; S.fight.swingVs=[]; }
        break;
      case "hit":
        if(e.src==="mob" && S.fight && S.fight.swingVs) S.fight.swingVs.push([e.vs,1]);
        if(e.vs==="mob"){
          if(typeof e.src==="number") PC(e.src).edge=false;
          if(S.fight){ S.fight.hp=Math.max(0,S.fight.hp-e.dmg); if(S.fight.hp===0) e.killed=true; }
        } else { hurt(e.vs, e.dmg); }
        if(e.lucky && typeof e.src==="number") PC(e.src).lucky=false;
        break;
      case "miss": if(e.src==="mob" && S.fight && S.fight.swingVs) S.fight.swingVs.push([e.vs,0]);
                   if(e.src==="mob" && typeof e.vs==="number" && RX(PC(e.vs),"ripo")>0 && !PC(e.vs).down) PC(e.vs).edge=true;
                   if(typeof e.src==="number"){ PC(e.src).edge=false; if(e.lucky) PC(e.src).lucky=false; } break;
      case "scrape":
        // Tiefling resilience applies here rather than at each of scrape's
        // three creation sites — one place, and the narrated number (read
        // straight off this same event object afterward) comes out already
        // correct. Mirrors how Stonecunning is applied where its damage is
        // finalized rather than threaded through every caller.
        if(hasAnc(PC(e.vs),"Infernal Resilience")) e.dmg=Math.max(1,e.dmg-2);
        if(RX(PC(e.vs),"trap")>0) e.dmg=Math.max(1,e.dmg-RX(PC(e.vs),"trap"));
        hurt(e.vs, e.dmg);
        break;
      case "heal": { const p=PC(e.vs); p.hp=Math.min(p.hpMax, p.hp+e.amt);
                     if(p.fx && p.fx.bleeding){ delete p.fx.bleeding; e.stanched=true; } break; }
      // ---- status effects ----
      case "fxon": {
        const o = e.vs==="mob" ? S.fight : PC(e.vs);
        if(!o || (e.vs!=="mob" && o.down)) { e.skip=true; break; }
        // Roots that make a character immune: Hold the Line, Clean Blood and kin.
        if(e.vs!=="mob" && ((e.fx==="frightened" && RX(o,"fear")>0) ||
           ((e.fx==="poisoned"||e.fx==="bleeding") && RX(o,"ward")>0))){ e.skip=true; e.resisted=true; break; }
        o.fx=o.fx||{};
        e.fresh=!(o.fx[e.fx]>0);
        o.fx[e.fx]=Math.max(o.fx[e.fx]||0, e.turns);
        break;
      }
      case "fxoff": { const o = e.vs==="mob" ? S.fight : PC(e.vs); if(o && o.fx) delete o.fx[e.fx]; break; }
      case "fxdmg": hurt(e.vs, e.dmg); break;
      case "fxdecay":
        e.expired=[];
        S.party.forEach(p=>{
          if(!p.fx) return;
          for(const id of Object.keys(p.fx)){
            if(id==="stunned") continue;          // lasts until the lost turn is spent
            p.fx[id]--;
            if(p.fx[id]<=0){ delete p.fx[id]; e.expired.push([p.name, id]); }
          }
        });
        break;
      case "edge": PC(e.vs).edge=true; break;
      case "rage": PC(e.src).rage=1; break;
      case "rattle": if(S.fight) S.fight.rattled=(S.fight.rattled||0)+(e.n||1); break;
      // Refresh, not stack — a second flask keeps the fire going for 2 more
      // of the monster's turns rather than piling up a second, faster burn.
      case "ignite": if(S.fight) S.fight.burning=2; break;
      case "burn":
        if(S.fight){ S.fight.hp=Math.max(0,S.fight.hp-e.dmg); if(S.fight.hp===0) e.killed=true; }
        break;
      case "rename": PC(e.vs).name=e.name; break;
      case "avatar": PC(e.vs).av={...PC(e.vs).av, em:e.em, col:e.col}; break;
      case "usepower": PC(e.src).power.uses--; break;
      case "potion": { const p=PC(e.src); p.potions--; e.amt+=RX(p,"heal"); p.hp=Math.min(p.hpMax,p.hp+e.amt);
                       if(p.fx){ e.cured=["poisoned","bleeding"].filter(id=>p.fx[id]>0);
                                 e.cured.forEach(id=>delete p.fx[id]); } break; }
      case "findpotion": PC(e.vs).potions++; break;
      case "revive": { const g=PC(e.src), t=PC(e.vs); g.potions--; t.down=false; t.hp=e.amt; t.fx={}; break; }
      case "stand": { const p=PC(e.vs); p.hp=Math.max(1,Math.floor(p.hpMax/4)); p.down=false; p.stand=true; break; }
      case "loot": PC(e.vs).inv.push(e.what); if(e.what===KEY_ITEM) ensureLockAhead(); break;
      case "dmhide": { const rm=S.map[S.at]; if(!rm.loot){ rm.loot=e.what; rm.searched=false; } break; }
      case "dmfound": {
        const rm=S.map[S.at], p=PC(e.vs);
        if(rm.loot && !rm.searched){ e.what=rm.loot; p.inv.push(rm.loot); rm.searched=true; if(rm.loot===KEY_ITEM) ensureLockAhead(); }
        else if(e.potion){ p.potions++; e.gotPotion=true; }
        break;
      }
      case "unlocked": { const rm=S.map[S.at]; if(rm.lock){ rm.lock.opened=true; rm.lock.by=e.src; } break; }
      case "itemused": { const p=PC(e.src); const i=p.inv.indexOf(e.item); if(i>=0) p.inv.splice(i,1); break; }
      case "move": S.at=e.to; break;
      case "grow": {
        const p=PC(e.vs), d=ROOTS[e.id];
        p.roots=[...rootsOf(p), {id:e.id, r:e.r, c:e.c, f:e.f}];
        if(d.fx.pots) p.potions+=d.fx.pots;
        if(d.fx.uses && p.power.uses<99) p.power.uses+=d.fx.uses;
        refreshRootStats(p, true);
        e.name=d.n;
        break;
      }
      case "uproot": {
        const p=PC(e.vs);
        p.potions=Math.max(0, p.potions-RX(p,"pots"));
        if(p.power.uses<99) p.power.uses=Math.max(0, p.power.uses-RX(p,"uses"));
        p.roots=[]; p.uprooted=true;
        refreshRootStats(p, false);
        break;
      }
      case "asi": {
        const p=PC(e.vs);
        p.ab[e.ab]=Math.min(20, p.ab[e.ab]+1);
        p.asi=Math.max(0,(p.asi||0)-1);
        const before=p.hpMax;
        p.hpMax=calcHpMax(p); p.hp=Math.max(p.down?0:1, p.hp+(p.hpMax-before));
        p.ac=calcAC(p);
        e.to=p.ab[e.ab];
        break;
      }
      case "teleport":
        if(e.dun){
          S.dun=e.dun; S.map=e.map;
          S.journal.push(`The current took you somewhere else entirely — ${DUNGEONS[S.dun].short} now, `+
                          `and ${DUNGEONS[S.dun].goal} to find.`);
        }
        S.at=e.to;
        ensureLockAhead();
        break;
      case "searched": S.map[S.at].searched=true; break;
      case "xp": {
        const share=Math.max(1, Math.round(e.amt/S.party.length));
        e.share=share;
        S.party.forEach((p,i)=>{ p.xp+=share; levelUp(p,e,i); });
        break;
      }
      case "talkdown":
        S.party.forEach((p,i)=>{ p.xp+=Math.max(1,Math.round(e.xp/2/S.party.length)); levelUp(p,e,i); });
        S.map[S.at].cleared=true; S.fight=null; clearFx();
        break;
      case "crown":
        S.flags.crown=true; S.flags.waking=true;
        PC(e.src).inv.push(DUNGEONS[S.dun].prize);
        S.journal.push(`${DUNGEONS[S.dun].prize} is ours. Now climb out.`);
        for(let i=1;i<S.map.length-1;i++){
          const rm=S.map[i]; rm.cleared=false; rm.searched=true;
          rm.mob = R.d(6)===6 ? R.pick(DUNGEONS[S.dun].escape) : null;
        }
        break;
      case "won": S.flags.won=true; break;
      case "fled": S.fight=null; clearFx(); break;
    }
    // Kept for the run's recent history only. It used to grow without limit,
    // and it rides along in every autosave, every save file and every
    // per-guest state push, so a long delve quietly inflated all three.
    S.log.push(e);
    if(S.log.length>200) S.log.splice(0, S.log.length-200);
  }
  if(partyWiped()) S.flags.dead=true;      // party wipe — real hp, not connection state
  return events;
}

function hurt(idx, dmg){
  const p=PC(idx);
  // Unburied and kin: once per run, the blow that would drop you doesn't.
  if(p.hp-dmg<=0 && p.hp>0 && RX(p,"unbur")>0 && !p.unburUsed){
    p.unburUsed=true; p.hp=1;
    out(`<span class="hit">${escHtml(p.name)} should be down. The roots will not let go. (1 hp)</span>`);
    return;
  }
  p.hp=Math.max(0,p.hp-dmg);
  if(p.hp===0){ p.down=true; p.fx={}; }
}
// Statuses only live inside a fight.
function clearFx(){ S.party.forEach(p=>{ p.fx={}; }); }

function levelUp(pc, e, i){
  while(pc.lvl<6 && pc.xp>=XP_NEED[pc.lvl]){
    pc.lvl++;
    const before=pc.hpMax;
    pc.hpMax=calcHpMax(pc); pc.hp+=pc.hpMax-before;
    pc.power.uses=powerUsesFor(pc);
    pc.asi=(pc.asi||0)+ASI_PER_LEVEL;          // ability points to spend
    if(rootsLeft(pc)>0 && !pc.isBoss) e.levels=(e.levels||[]).concat(`${pc.name} has a root to grow (open the Roots tab)`);
    if(i===S.me) e.leveled=pc.lvl;
    e.levels=(e.levels||[]).concat(`${pc.name} is now level ${pc.lvl} (+${ASI_PER_LEVEL} ability points)`);
  }
}

/* ------------------------------------------------------------ narrator --- */
const Narrator = {
  // "ollama" is the master on/off switch (kept under its original name so
  // every existing call site — render()'s gate, the reset-on-failure spots —
  // needs no change); "backend" says which fetch ask() should make when it's
  // on. "local" is the original localhost:11434 Ollama call; "cloud" is the
  // same idea via this repo's own /api/narrate serverless function, for
  // anyone who doesn't want to run a model on their own machine.
  ollama:false, backend:null, model:null,

  nm(i){ return S.party.length>1 ? `<span class="who">${PC(i).name}</span>` : "You"; },
  nmL(i){ return S.party.length>1 ? `<span class="who">${PC(i).name}</span>` : "you"; },
  poss(i){ return S.party.length>1 ? `<span class="who">${PC(i).name}</span>'s` : "your"; },

  line(e){
    const N=Narrator, RL=(x)=>`<span class="roll">${x}</span>`;
    switch(e.t){
      case "hit":
        if(e.vs!=="mob"){
          const pc=PC(e.vs);
          return `<span class="hurt">${e.who} ${e.crit?"catches":"connects with"} ${N.nmL(e.vs)}</span>${e.auto?"":` — ${RL(`d20 ${e.r}+${e.b}=${e.tot} vs AC ${e.ac}`)}`} — <b>${e.dmg}</b> damage${pc.hp===0?` — <span class="hurt">and ${pc.name} goes down.</span>`:"."}`;
        }
        return `<span class="hit">${N.poss(e.src)} ${e.wpn} lands${e.crit?" — a clean, ugly hit":""}${e.adv?" (from the blind side)":""}${e.dis?" (shaking)":""}${e.sneak?` (+${e.sneak} blind side)`:""}${e.bonus?` (+${e.bonus})`:""}${e.lucky?` <em>— second look</em>`:""}</span>${e.auto?"":` — ${RL(`d20 ${e.r}+${e.b}=${e.tot} vs AC ${e.ac||(S.fight&&S.fight.ac)||"—"}`)}`} — <b>${e.dmg}</b> damage.`;
      case "miss":
        if(e.src==="mob") return `<span class="miss">${e.who} comes at ${N.nmL(e.vs)}${e.rattled?", still off its stride,":""} and finds only armour</span> — ${RL(`d20 ${e.r}+${e.b}=${e.tot} vs AC ${e.ac}`)}.`;
        return `<span class="miss">${N.nm(e.src)} swings wide${e.dis?", hands not steady,":""}${e.fumble?" and nearly goes over":""}${e.lucky?", even given a second look,":""}</span> — ${RL(`d20 ${e.r}+${e.b}=${e.tot} vs AC ${e.ac}`)}.`;
      case "heal": return `<span class="hit">${N.nm(e.vs)} steadies. <b>+${e.amt}</b> hit points${e.stanched?", and the bleeding stops":""}.</span>`;
      case "scrape": return `<span class="hurt">It goes wrong on ${N.nmL(e.vs)}. <b>${e.dmg}</b> damage.</span>`;
      case "potion": return `${N.nm(e.src)} works a stopper free and drinks. <span class="hit">+${e.amt} hit points${e.cured&&e.cured.length?`, and no longer ${e.cured.join(" or ")}`:""}.</span>`;
      case "findpotion": return `<span class="hit">A potion, still sealed, still good.</span>`;
      case "revive": return `<span class="hit">${N.nm(e.src)} gets a potion into ${PC(e.vs).name} and hauls them up — <b>${e.amt}</b> hit points, and a great deal of swearing.</span>`;
      case "edge": return `<span class="hit">${N.nm(e.vs)} has the better of the position now — the next strike comes in clean.</span>`;
      case "rage": return `<span class="hurt">${N.nm(e.src)} stops being careful.</span> <span class="hit">Everything hurts more, coming and going.</span>`;
      case "rattle": return `<span class="hit">It loses the thread of what it was doing.</span>`;
      case "ignite": return null; // silent — the hit line for the flask connecting already says it caught
      case "burn": return `<span class="hit">The fire hasn't gone out. <b>${e.dmg}</b> more damage.</span>`;
      case "itemused": return null; // silent — the hit/miss/rattle line right alongside it already says what happened
      case "rename": return `<span class="sys">${e.was} is called ${e.name} now.</span>`;
      case "usepower": return `<em>${N.poss(e.src)} ${e.name}.</em>`;
      case "nopower": return `<span class="sys">${N.nm(e.src)} reaches for ${e.name} and finds nothing left.</span>`;
      case "note": return e.text;
      case "fxon": {
        if(e.resisted) return `<span class="hit">${escHtml(PC(e.vs).name)} shrugs it off. The roots hold.</span>`;
        if(e.skip) return null;
        const st=STATUS[e.fx];
        if(e.vs==="mob") return `<span class="hit">${S.fight?S.fight.the:"It"} is ${st.name.toLowerCase()} — it will lose its next turn.</span>`;
        const who=escHtml(PC(e.vs).name);
        const turns = e.fx==="stunned" ? "" : ` for ${e.fx==="blessed"?e.turns-1:e.turns} turns`;
        return st.bad
          ? `<span class="hurt">${st.icon} ${who} is ${st.name.toLowerCase()}${e.fresh?"":" again"}${turns}</span> <span class="sys">— ${st.desc}</span>`
          : `<span class="hit">${st.icon} ${who} is ${st.name.toLowerCase()}${turns}</span> <span class="sys">— ${st.desc}</span>`;
      }
      case "fxoff": return null;
      case "fxdmg": {
        const p=PC(e.vs);
        return `<span class="hurt">${STATUS[e.fx].icon} ${e.fx==="poisoned"?"Poison works through":"Blood runs from"} ${escHtml(p.name)} — <b>${e.dmg}</b> damage${p.hp===0?`, and ${escHtml(p.name)} goes down.`:"."}</span>`;
      }
      case "fxdecay":
        return e.expired && e.expired.length
          ? `<span class="sys">${e.expired.map(([n,id])=>`${escHtml(n)} is no longer ${STATUS[id].name.toLowerCase()}`).join(" · ")}.</span>` : null;
      case "unlocked": return e.kind==="chest"
        ? `🗝 ${escHtml(PC(e.src).name)} works the rusty key into the lock. It grinds, sticks, and turns — <span class="hit">the lid comes up.</span>`
        : `🗝 ${escHtml(PC(e.src).name)} works the rusty key into the lock. It grinds, sticks, and turns — <span class="hit">behind the door, a cramped storeroom nobody has opened in years.</span>`;
      case "mimic": return `<span class="hurt">The lid keeps opening. It has teeth. The chest was never a chest.</span>`;
      case "dmsay": return `<span class="dmsay">🎭 ${escHtml(e.text)}</span>`;
      case "judge": {
        const L=e.line?` <span class="dmsay inline">🎭 ${escHtml(e.line)}</span>`:"";
        return `${N.nm(e.src)} tries it — ${RL(`${e.abil.toUpperCase()} ${e.roll.tot} vs DC ${e.roll.dc}`)} — `+
               (e.roll.ok?`<span class="hit">it works.</span>`:`<span class="miss">it doesn't.</span>`)+L;
      }
      case "dmtrap": return `${escHtml(PC(e.vs).name)} reacts — ${RL(`DEX ${e.roll.tot} vs DC ${e.roll.dc}`)} — `+
        (e.roll.ok?`<span class="hit">and gets clear.</span>`:`<span class="hurt">and is caught.</span>`);
      case "dmhide": return `<span class="sys">Something here may be worth a proper search.</span>`;
      case "dmfound": return e.what ? `<span class="hit">${N.nm(e.vs)} turns up ${escHtml(e.what)}.</span>`
                       : e.gotPotion ? `<span class="hit">${N.nm(e.vs)} turns up a sealed potion.</span>`
                       : `<span class="sys">Nothing new turns up.</span>`;
      case "dmwander": return null;
      case "stunlost": return `<span class="hurt">💫 ${escHtml(PC(e.src).name)} is stunned, and the turn goes by without them.</span>`;
      case "asi": return `<span class="hit">${escHtml(PC(e.vs).name)}'s ${e.ab.toUpperCase()} rises to <b>${e.to}</b>.</span>`;
      case "grow": return `<span class="hit">${escHtml(PC(e.vs).name)}'s roots reach into ${ROOT_DEPTH[rootBand(e.r)].toLowerCase()}: <b>${escHtml(e.name)}</b>.</span>`;
      case "uproot": return `<span class="sys">${escHtml(PC(e.vs).name)} pulls every root back up. They can be grown again, differently.</span>`;
      case "taunt": return `<span class="taunt">🎭 ${escHtml(PC(e.src).name)}: <b>${e.text}</b></span>`;
      case "searched":
        return e.auto
          ? `${N.nm(e.src)} goes over the ${PLACE()} with notes in hand — and the patience is rewarded.`
          : `${N.nm(e.src)} goes over the ${PLACE()} properly — ${RL(`WIS ${e.roll.r}+${e.roll.b}=${e.roll.tot} vs DC ${e.roll.dc}`)} — ${e.roll.ok?"and the patience is rewarded.":"and turns up nothing worth the time."}`;
      case "loot": return `<span class="hit">${N.nm(e.vs)} finds ${e.what}.</span>`;
      case "noise": return `<span class="hurt">Something goes over with a clatter. The sound travels a long way down here.</span>`;
      case "rest": return `You wedge yourselves into a corner where nothing can come at your backs, and close your eyes.`;
      case "wandering": return `<span class="hurt">The rest does not finish.</span>`;
      case "fled": return e.judged ? `<span class="hit">${N.nm(e.src)} makes the opening, and the party gets clear.</span>` : e.auto
        ? `<span class="hit">${N.nm(e.src)} slips the lock and the party is through before anything notices.</span>`
        : `<span class="hit">${N.nm(e.src)} breaks away and the party goes with them</span> — ${RL(`DEX ${e.roll.tot} vs DC ${e.roll.dc}`)}.`;
      case "nofled": return `<span class="hurt">${N.nm(e.src)} turns to run and it is already moving</span> — ${RL(`DEX ${e.roll.tot} vs DC ${e.roll.dc}`)}.`;
      case "xp": return `<span class="sys">+${e.share||e.amt} experience each.${e.levels?" <b>"+e.levels.join(". ")+".</b>":""}</span>`;
      case "crown": return `<span class="hit">${DUNGEONS[S.dun].prize} is lighter than it looks, and colder than the ${PLACE()}.</span>`;
      case "teleport": return e.dun
        ? `<span class="hurt">The floor is not the floor. Something takes hold of the whole party at once and does not let go until it is done with you.</span>`
        : `<span class="hurt">The ${PLACE()} tilts, or you do, and when it settles you are somewhere you have not been before.</span>`;
      case "stand": return `<span class="hurt">${N.nm(e.vs)} goes down —</span> and then does not. <span class="hit">Something refuses</span> — ${RL(`CON ${e.roll.tot} vs DC ${e.roll.dc}`)} — <b>${PC(e.vs).hp}</b> hit points, and no more reprieves.`;
      case "insight":
        return `<span class="hit">${S.fight
          ? `${N.nm(e.src)} reads it better now. ${S.fight.the} can take perhaps <b>${S.fight.hp}</b> more.`
          : `${N.nm(e.src)} gets the measure of the place — <b>${Math.max(0,S.map.length-1-S.at)}</b> ${PLACE()}${S.map.length-2-S.at===0?"":"s"} still to the vault.`}</span>`;
      case "talkalone": return `<span class="sys">${N.nm(e.src)} speaks, and the barrow takes the sound and keeps it.</span>`;
      case "talkdown": return e.auto
        ? `<span class="hit">${N.nm(e.src)} picks out a tune on the battered lute, low and strange</span> — and whatever is left in ${e.name.toLowerCase()} decides you are not worth it. It withdraws.`
        : `<span class="hit">${N.nm(e.src)} keeps talking</span> — ${RL(`CHA ${e.roll.tot} vs DC ${e.roll.dc}`)} — <span class="hit">and whatever is left in ${e.name.toLowerCase()} decides you are not worth it. It withdraws.</span>`;
      case "talkhold": return `${N.nm(e.src)} keeps talking — ${RL(`CHA ${e.roll.tot} vs DC ${e.roll.dc}`)} — and ${e.name.toLowerCase()} <span class="hit">hesitates</span>, long enough to cost it the turn.`;
      case "talkfail": return `<span class="miss">${N.nm(e.src)} starts to speak</span> — ${RL(`CHA ${e.roll.tot} vs DC ${e.roll.dc}`)} — <span class="hurt">and it is not listening.</span>`;
      case "pray": return e.auto
        ? `<span class="hit">${N.nm(e.src)} works the prayer beads through worn fingers and asks</span> — <span class="hit">and something older than the barrow inclines toward them.</span>`
        : e.ok
        ? `<span class="hit">${N.nm(e.src)} puts a forehead to the cold stone and asks</span> — ${RL(`WIS ${e.roll.tot} vs DC ${e.roll.dc}`)} — <span class="hit">and something older than the barrow inclines toward them.</span>`
        : `${N.nm(e.src)} asks — ${RL(`WIS ${e.roll.tot} vs DC ${e.roll.dc}`)} — <span class="sys">and nothing answers. That is usually how it goes.</span>`;
      case "hidealone": return `<span class="sys">${N.nm(e.src)} presses into the shadow. There is nothing here to hide from.</span>`;
      case "hid": return `<span class="hit">${N.nm(e.src)} gets out of its eyeline</span> — ${RL(`DEX ${e.roll.tot} vs DC ${e.roll.dc}`)} — <span class="hit">and it loses them.</span>`;
      case "hidefail": return `<span class="miss">${N.nm(e.src)} tries to slip aside</span> — ${RL(`DEX ${e.roll.tot} vs DC ${e.roll.dc}`)} — <span class="hurt">and it tracks the whole way.</span>`;
      case "oracle": {
        const y=e.o.yes, ok=e.roll.ok;
        const tail = y &&  ok ? "It works, and cleanly."
                   : y && !ok ? "It works — but it costs something."
                   : !y &&  ok ? "It comes to nothing, though nobody loses their nerve."
                   :             "It comes to nothing, and they are worse off for having tried.";
        const what = e.item ? ` <span class="sys">(with the ${e.item.toLowerCase()})</span>` : "";
        return `<span class="orc">${e.o.text}</span> ${tail}${what} <span class="roll">oracle d6 · ${e.abil?e.abil.toUpperCase()+" ":""}${e.roll.tot} vs DC ${e.roll.dc}</span>`;
      }
      default: return null;
    }
  },

  async render(events, context){
    // Verbatim events (a bard's cutting words) are printed exactly as
    // written, ahead of everything else, and never sent to the AI — a
    // reworded insult is not the insult the player earned.
    const vlines=events.filter(e=>e.verbatim).map(Narrator.line).filter(Boolean);
    vlines.forEach(l=>out(l));
    const lines=events.filter(e=>!e.verbatim).map(Narrator.line).filter(Boolean);
    // Picture cards for anything found this turn, printed after the prose.
    const found=[];
    events.forEach(e=>{
      if(e.t==="loot" && e.what) found.push(e.what);
      else if(e.t==="findpotion") found.push("Potion of healing");
      else if(e.t==="dmfound") { if(e.what) found.push(e.what); else if(e.gotPotion) found.push("Potion of healing"); }
      else if(e.t==="crown") found.push(DUNGEONS[S.dun].prize);
    });
    const fh=found.length?findsHTML(found):"";
    DM.note(vlines.concat(lines).join(" ").replace(/<[^>]+>/g,""));
    if(!lines.length){ if(fh) out(fh); return; }
    const plain=lines.join(" ");
    if(!Narrator.ollama){ out(plain); if(fh) out(fh); return; }
    dot("busy");
    const better=await Narrator.ask(plain, context);
    dot("on");
    out(better || plain);
    // Keep the original hit/miss/hurt color spans in this recap line — only
    // strip tags for the sound-effect classifier (sfxForLine), never for
    // display. .sys only sets size/italic; a nested span's own color rule
    // still wins over it, so the recap stays small and muted *and* colored
    // the same way the primary line always was.
    if(better) out(`<span class="sys">${plain}</span>`);
    if(fh) out(fh);
  },

  async ask(text, context){
    if(Narrator.backend==="cloud") return Narrator.askCloud(text, context);
    try{
      const sys=`You are narrating a grim, restrained fantasy dungeon crawl.
You will be given the MECHANICAL OUTCOME of a turn. It is already final and true.
Rewrite it as 2-3 sentences of atmospheric prose. Rules:
- Never change, soften, or add to the outcome. Damage, hits, misses and finds are fixed.
- Never invent items, exits, or creatures. Keep every character name exactly as given.
- Never roll dice or state numbers. No preamble. Prose only.
Scene: ${context||"the barrow"}.`;
      const res=await fetch("http://localhost:11434/api/generate",{
        method:"POST", headers:{"Content-Type":"application/json"},
        body:JSON.stringify({model:Narrator.model, system:sys, stream:false,
          prompt:text.replace(/<[^>]+>/g,""), options:{temperature:0.8, num_predict:170}})
      });
      const j=await res.json();
      return (j.response||"").trim();
    }catch(err){
      Narrator.ollama=false; Narrator.backend=null; dot(""); aitxt("Narrator: built-in"); updateAiButtons();
      return null;
    }
  },

  // Same contract as ask()'s local branch — hand over the finished outcome,
  // get back 2-3 sentences of prose — just routed through this repo's own
  // /api/narrate function instead of a model on the player's own machine.
  // That function is same-origin, so this only ever has a chance of working
  // once the game is actually running on its hosted address; opened as a
  // local file it will simply fail and fall back, same as a missing Ollama.
  async askCloud(text, context){
    try{
      const res=await fetch("/api/narrate",{
        method:"POST", headers:{"Content-Type":"application/json", "x-barrow-key":"barrow-of-vethkar"},
        body:JSON.stringify({text:text.replace(/<[^>]+>/g,""), context:context||"the barrow"}),
        signal:AbortSignal.timeout(9000)
      });
      if(!res.ok) throw new Error("bad status "+res.status);
      const j=await res.json();
      return (j.text||"").trim() || null;
    }catch(err){
      Narrator.ollama=false; Narrator.backend=null; dot(""); aitxt("Narrator: built-in"); updateAiButtons();
      return null;
    }
  }
};

/* ------------------------------------------------- AI dungeon master --- */
/* With Cloud AI connected (and the 🎭 AI DM toggle on), the AI also takes
   part in play — but only by CHOOSING from menus this file hands it. Dice
   decide every outcome; the host re-checks every answer (move on the list,
   target exists, DC clamped, per-run caps) before acting on it; anything
   wrong, slow or missing just falls back to the ordinary game. Runs on the
   host only — guests get the results like any other turn. */
const DM_CAPS = {wander:2, trap:3, loot:3, boon:3};      // per run
const JUDGE_SUCCESS = ["damage","edge","rattle","heal","find","escape","insight","nothing"];
const JUDGE_FAILURE = ["hurt","noise","exposed","nothing"];
// A clever trick may not be easier than the effect it buys.
const JUDGE_MIN_DC = {damage:13, escape:12, find:11, heal:10};
const DM = {
  enabled:true,
  recent:[],
  on(){ return DM.enabled && Narrator.ollama && Narrator.backend==="cloud" && Net.mode!=="guest" && !!S; },
  note(plain){ if(!plain) return; DM.recent.push(plain.slice(0,200)); if(DM.recent.length>6) DM.recent.shift(); },
  ledger(){ if(!S.dm) S.dm={wander:0,trap:0,loot:0,boon:0,rooms:{}}; return S.dm; },
  snapshot(){
    const r=S.map[S.at], D=DUNGEONS[S.dun];
    return {
      dungeon:D.name, place:PLACE(), depth:S.at+1, of:S.map.length,
      room:{name:r.n, desc:`${r.f} ${r.det}`},
      escaping_with_prize:!!S.flags.crown,
      fight: S.fight ? {name:S.fight.name, health:Math.round(100*S.fight.hp/S.fight.hpMax)+"%"} : null,
      party:S.party.map((p,i)=>({index:i, name:p.name, class:p.cls, level:p.lvl,
        health:Math.round(100*p.hp/p.hpMax)+"%", down:!!p.down,
        status:Object.keys(p.fx||{}).filter(k=>p.fx[k]>0)})).filter(p=>!S.party[p.index].isBoss),
      recent:DM.recent.slice(-6)
    };
  },
  async call(mode, state){
    try{
      const res=await fetch("/api/dm",{
        method:"POST", headers:{"Content-Type":"application/json","x-barrow-key":"barrow-of-vethkar"},
        body:JSON.stringify({mode, state}), signal:AbortSignal.timeout(9000)
      });
      if(!res.ok) return null;
      const j=await res.json();
      return j && j.result || null;
    }catch(e){ return null; }       // never disconnects the narrator — just no DM this time
  },
  // Monsters the DM may send: this dungeon's own table for the current depth.
  tier(){ const t=DUNGEONS[S.dun].tables; return S.at<=3 ? t.early : S.at<=6 ? t.mid : t.late; },
  allowedMoves(){
    const L=DM.ledger(), m=["none","twist"];
    if(!S.flags.crown && S.at>0 && L.wander<DM_CAPS.wander) m.push("wander");
    if(L.trap<DM_CAPS.trap && conscious().length) m.push("trap");
    if(!S.flags.crown && !S.map[S.at].loot && L.loot<DM_CAPS.loot) m.push("loot");
    if(L.boon<DM_CAPS.boon) m.push("boon");
    return m;
  }
};

/* -------------------------------------------------------------- parser --- */
/* Four rules, each from a real playtest failure:
   1. Only the HEAD VERB counts.
   2. Negation always wins.
   3. Questions are answered from state, never rolled.
   4. Never invent capability — "use X" is checked against what you have.     */

const FILLER = new Set(["i","id","i'd","ill","i'll","im","i'm","ive","i've","let","lets","let's",
  "me","my","we","our","you","try","trying","tries","to","want","wants","wanted","wish","would",
  "will","like","then","and","so","just","now","please","the","a","an","gonna","going","go",
  "attempt","attempts","decide","choose","carefully","quietly","slowly","quickly","cautiously",
  "softly","first","next","maybe","perhaps","really","actually","also","still","again","make",
  "makes","set","start","begin","over","up","down","at","on","with","some","for"]);

const QUERY_HEAD = new Set(["what","whats","what's","where","wheres","where's","who","whos","who's",
  "how","hows","how's","why","which","when","do","does","did","can","could","should","am","is",
  "are","was","were","has","have","tell","explain","remind"]);

const VERBS = {
  move:   ["move","walk","head","travel","enter","descend","deeper","north","south","east","west",
           "onward","forward","proceed","continue","advance","press","venture","march","step"],
  climb:  ["climb"],
  back:   ["back","retreat","withdraw","return","backward","backwards"],
  look:   ["look","examine","inspect","observe","view","survey","peer","glance","read","watch","see"],
  check:  ["check"],
  search: ["search","loot","ransack","rummage","scour","investigate","explore","dig","sift","comb"],
  attack: ["attack","hit","strike","fight","kill","stab","swing","slash","charge","engage","shoot",
           "punch","smash","slay","assault","lunge","thrust","cut","bash","club"],
  power:  ["cast","channel","invoke","smite","conjure"],
  potion: ["drink","quaff","sip"],
  rest:   ["rest","sleep","camp","recover","recuperate","bandage","bind","heal","nap"],
  flee:   ["flee","run","escape","bolt","sprint"],
  take:   ["take","grab","get","pick","pocket","steal","claim","wear","don","collect","lift"],
  listen: ["listen","hear"],
  wait:   ["wait","pause","hold","linger","stay","brace","ready"],
  talk:   ["talk","speak","say","shout","yell","call","greet","hail","ask","tell","address",
           "parley","negotiate","bargain","bribe","threaten","plead","beg","persuade","reason"],
  pray:   ["pray","meditate","beseech","worship","supplicate"],
  hide:   ["hide","sneak","conceal","creep","skulk","duck","crouch","shadow"],
  revive: ["revive","rouse","wake","save","rescue","stabilise","stabilize","drag"],
  unlock: ["unlock","open","pry"],
  use:    ["use","apply","employ","wield","equip","activate","throw","toss","hurl","scatter"],
  inv:    ["inventory","items","bag","pack","gear","sheet","stats","character","equipment","carrying"],
  cmds:   ["help","commands","controls"]
};

const VERB_OF = {};
for (const [cat, ws] of Object.entries(VERBS)) ws.forEach(w => { if(!(w in VERB_OF)) VERB_OF[w]=cat; });

const NOUNS = {
  pack:  ["pack","bag","inventory","pockets","pocket","belongings","gear","satchel","backpack","equipment","sheet"],
  crown: ["crown","circlet","diadem","reliquary","tideglass","prize","relic"],
  out:   ["out","up","upward","upwards","surface","daylight","stairs","steps","exit","outside","sunlight"],
  room:  ["room","chamber","floor","wall","walls","rubble","debris","corner","corners","bones",
          "body","bodies","corpse","remains","here","around","ground","stones"]
};
const has = (toks, key) => NOUNS[key].some(n => toks.includes(n));

function actionLabel(a){
  const me=ME();
  return ({ move:"move on", look:"look around", search:`search the ${PLACE()}`, attack:"attack",
            potion:"drink a potion", rest:"rest", flee:"flee", take:"take the crown",
            listen:"listen", inv:"check your gear", wait:"wait", cmds:"commands", talk:"speak to it",
            pray:"pray", hide:"hide", query:"a question", revive:"help an ally up", noSuch:"—",
            unlock:"unlock it with the rusty key",
            power:(me?me.power.name:"your ability") })[a] || a;
}

function guessAbility(t){
  const s=" "+t.toLowerCase()+" ";
  if(/\b(lift|shove|push|pull|force|break|smash|heave|pry|bend|carry|throw|drag|kick|wrench|topple|block|barricade)\b/.test(s)) return "str";
  if(/\b(sneak|slip|dodge|jump|climb|balance|nimble|catch|tumble|hide|dart|weave|snatch|swing)\b/.test(s)) return "dex";
  if(/\b(endure|resist|brace|withstand|swallow|breath|steady)\b/.test(s)) return "con";
  if(/\b(magic|arcane|rune|sigil|spell|lore|decipher|recall|study|figure|solve|craft|build|fashion|rig|repair|translate|remember)\b/.test(s)) return "int";
  if(/\b(listen|smell|sense|notice|spot|watch|feel|pray|meditate|calm|guess|track)\b/.test(s)) return "wis";
  if(/\b(talk|speak|persuade|threaten|beg|bribe|charm|lie|shout|sing|command|plead|intimidate|distract|taunt)\b/.test(s)) return "cha";
  return R.pick(["str","dex","int","wis","cha"]);
}

function answerQuery(toks){
  const any=(...w)=>w.some(x=>toks.includes(x));
  const me=ME(), C=CLASSES[me.cls];

  if(any("magic","magical","spell","spells","ability","abilities","power","powers","cast","casting"))
    return `<span class="sys">${me.name} is a ${me.cls.toLowerCase()}. One trick: <b>${me.power.name}</b> — ${C.power.desc} `+
           `<b>${me.power.uses}</b> use${me.power.uses===1?"":"s"} left; type <em>cast</em> to spend one. `+
           `Each class gets exactly one ability.</span>`;
  if(any("health","hp","hurt","wounded","hitpoints","alive","dying","condition"))
    return `<span class="sys">${me.hp} of ${me.hpMax} hit points. Armour class ${me.ac}. `+
           `${me.potions} potion${me.potions===1?"":"s"}.${me.stand?" Your one reprieve is spent.":""}</span>`;
  if(any("inventory","carrying","pack","bag","items","gear","got","have","carry","holding"))
    return `<span class="sys">${me.name} carries: ${me.inv.join(", ")}${me.potions?`, and ${me.potions} potion${me.potions===1?"":"s"} of healing`:""}.</span>`;
  if(any("party","team","who","allies","everyone","others"))
    return `<span class="sys">${S.party.map(p=>`${p.name} the ${p.cls.toLowerCase()} (${p.down?"down":`${p.hp}/${p.hpMax}`})`).join(" · ")}</span>`;
  if(any("where","room","chamber","deep","depth","far","place","location","am"))
    return `<span class="sys">${S.map[S.at].n} — ${PLACE()} ${S.at+1} of ${S.map.length}. `+
           `${S.flags.crown?"You are climbing out.":`${S.map.length-1-S.at} between you and the vault.`}</span>`;
  if(S.fight && any("it","monster","creature","enemy","fighting","that","thing","this"))
    return `<span class="sys">${S.fight.the} — ${S.fight.fl}. Armour class ${S.fight.ac}. `+
           `Looks like it can take about ${S.fight.hp} more.</span>`;
  if(any("do","can","actions","options","possible","allowed","turn"))
    return `<span class="sys">Anything you like — these are read as commands: `+
           `<b>go</b>, <b>look</b>, <b>search</b>, <b>attack</b>, <b>cast</b>, <b>drink</b>, <b>rest</b>, `+
           `<b>flee</b>, <b>hide</b>, <b>talk</b>, <b>pray</b>, <b>revive</b>, <b>wait</b>, <b>listen</b>, <b>inventory</b>. `+
           `Anything else goes to the oracle, which rolls and has real consequences.</span>`;
  return `<span class="sys">Nothing here answers that. Ask about your abilities, your health, `+
         `your gear, the party, where you are${S.fight?", or what you are fighting":""}.</span>`;
}

function parse(text){
  const raw=text.trim(), lower=raw.toLowerCase();
  const toks=lower.replace(/[^a-z0-9' ]/g," ").split(/\s+/).filter(Boolean);
  if(!toks.length) return null;

  const FREE={action:"freeform", raw};
  const negated=/\b(don'?t|do ?not|doesn'?t|didn'?t|won'?t|can'?t|cannot|never|no longer|instead of|rather than|without|avoid|refuse|stop)\b/.test(lower);

  if((/\?\s*$/.test(raw) || QUERY_HEAD.has(toks[0])) && !(negated && !/\?\s*$/.test(raw)))
    return {action:"query", raw};
  if(negated) return FREE;

  let head=null;
  for(const w of toks){
    if(FILLER.has(w)) continue;
    head=VERB_OF[w]||null;
    break;
  }
  if(head===null && /^\s*go\b/.test(lower))
    head = has(toks,"out")||toks.includes("back") ? "back" : "move";
  if(!head) return FREE;

  const me=ME(), fighting=!!S.fight, crown=S.flags.crown, room=S.map[S.at], last=S.map.length-1;
  const ask=(note,alts)=>({action:"ask", note, alts, raw});
  const ok=(a)=>({action:a, raw});
  const ORACLE=["Let the barrow decide","freeform"];

  switch(head){
    case "inv": case "listen": case "look": case "wait": case "pray":
      return ok(head);

    // "help" is the docs — unless someone is on the floor and you mean them.
    case "cmds": {
      const dn=S.party.map((p,i)=>({p,i})).filter(x=>x.p.down && x.i!==S.me);
      if(dn.length && (toks.includes("up")||dn.some(x=>toks.includes(x.p.name.toLowerCase()))||
                       toks.includes("him")||toks.includes("her")||toks.includes("them")))
        return me.potions>0 ? {action:"revive", raw, target:(dn.find(x=>toks.includes(x.p.name.toLowerCase()))||dn[0]).i}
                            : ask("You have no potion to give them.", [ORACLE]);
      return ok("cmds");
    }
    case "talk": return ok("talk");
    case "hide": return ok("hide");

    case "revive": {
      const down=S.party.map((p,i)=>({p,i})).filter(x=>x.p.down && x.i!==S.me);
      if(!down.length) return FREE;
      if(me.potions<=0) return ask("You have no potion to give them.", [ORACLE]);
      const named=down.find(x=>toks.includes(x.p.name.toLowerCase()));
      if(named || down.length===1) return {action:"revive", raw, target:(named||down[0]).i};
      return ask("Help which of them up?", down.map(x=>[x.p.name,"revive:"+x.i]).concat([ORACLE]));
    }

    case "use": {
      const pw=me.power.name.toLowerCase().split(/\s+/);
      if(pw.some(w=>toks.includes(w)) || toks.includes("power") || toks.includes("ability") || toks.includes("spell"))
        return me.power.uses>0 ? ok("power")
          : ask(`No ${me.power.name.toLowerCase()} left.`, [fighting?["Attack instead","attack"]:["Look around","look"], ORACLE]);
      if(toks.includes("potion")||toks.includes("healing"))
        return me.potions>0 ? ok("potion") : ask("You have no potions left.", [ORACLE]);
      if(toks.includes("key") && me.inv.includes(KEY_ITEM)){
        if(room.lock && !room.lock.opened && !fighting) return ok("unlock");
        return ask(fighting ? "Not with that thing watching you." : "Nothing here has a lock for it.", [["Look around","look"], ORACLE]);
      }
      // dedicated combat items (see ITEM_EFFECTS) take priority over the
      // generic oracle fallback below — checked against actual inventory,
      // same "never invent capability" rule as everywhere else in here.
      const known=me.inv.find(i=>ITEM_EFFECTS[i] && i.toLowerCase().split(/[^a-z]+/).some(w=>w.length>3 && toks.includes(w)));
      if(known){
        if(!fighting) return ask(`Nothing here to use ${known.toLowerCase()} on.`, [["Look around","look"], ORACLE]);
        return {action:"useItem", raw, target:known};
      }
      const item=me.inv.find(i=>i.toLowerCase().split(/[^a-z]+/).some(w=>w.length>3 && toks.includes(w)));
      if(item) return {action:"freeform", raw, item};
      return {action:"noSuch", raw};
    }

    case "unlock":
      // "open the door" in a room with nothing locked stays an oracle question,
      // exactly as it was before this verb existed.
      if(!room.lock || room.lock.opened) return FREE;
      if(fighting) return ask("Not with that thing watching you.", [["Attack it","attack"],["Flee","flee"], ORACLE]);
      if(!me.inv.includes(KEY_ITEM)) return ask("It's locked, and the rusted lock won't give to fingers. A key might turn it.", [["Search the room","search"],["Move on","move"], ORACLE]);
      return ok("unlock");

    case "check":
      return has(toks,"pack") ? ok("inv")
        : ask("Check what?", [["Your gear","inv"],[`The ${PLACE()}`,"look"], ORACLE]);

    case "search":
      if(has(toks,"pack")) return ok("inv");
      if(fighting) return ask("Not while that is looking at you.", [["Attack it","attack"],["Flee","flee"], ORACLE]);
      if(room.searched) return ask(`This ${PLACE()} has been gone over already.`, [["Look again","look"],["Move on","move"], ORACLE]);
      return ok("search");

    case "attack":
      if(fighting) return ok("attack");
      return ask("Nothing here is fighting you.", [["Look around","look"], ORACLE]);

    case "power":
      if(me.power.uses<=0) return ask(`No ${me.power.name.toLowerCase()} left.`,
        [fighting?["Attack instead","attack"]:["Look around","look"], ORACLE]);
      if(me.power.name==="Second Wind" && me.hp>=me.hpMax)
        return ask("You are unhurt — Second Wind would be thrown away.",
          [fighting?["Attack instead","attack"]:["Look around","look"], ORACLE]);
      if(!fighting && me.power.name!=="Second Wind")
        return ask("Nothing to aim it at.", [["Look around","look"], ORACLE]);
      return ok("power");

    case "potion":
      if(me.potions<=0) return ask("You have no potions left.", [ORACLE]);
      if(me.hp>=me.hpMax) return ask("You are unhurt — no sense wasting it.", [ORACLE]);
      return ok("potion");

    case "rest":
      if(fighting) return ask("You will not be resting.", [["Attack it","attack"],["Flee","flee"], ORACLE]);
      return ok("rest");

    case "flee":
      if(fighting) return ok("flee");
      return FREE;

    case "take":
      if(has(toks,"crown") || (S.at===last && !crown && !fighting)) return ok("take");
      return FREE;

    case "back":
      if(fighting) return ask("Break off?", [["Flee","flee"],["Keep fighting","attack"], ORACLE]);
      if(crown) return ok("move");
      return ask("There is nothing behind you but the way you came.",
        [["Press on instead","move"],["Look around","look"], ORACLE]);

    case "climb":
      if(crown && (has(toks,"out")||toks.includes("back"))) return ok("move");
      if(has(toks,"out") && !crown) return ask(`Not without ${DUNGEONS[S.dun].goal}.`, [["Press on","move"], ORACLE]);
      return ask("Climb what?", [["On to the next chamber","move"], ORACLE]);

    case "move":
      if(fighting) return ask("It is between you and the way on.",
        [["Attack it","attack"],["Flee","flee"], ORACLE]);
      if(crown && (toks.includes("deeper")||toks.includes("down")) && !has(toks,"out"))
        return ask("You have what you came for. Down is the wrong way.",
          [["Climb toward the surface","move"], ORACLE]);
      return ok("move");
  }
  return FREE;
}

/* ----------------------------------------------------------------- net --- */
/* Host-authoritative. Guests send intents; they never roll anything.
   The transport is pluggable so the protocol can be tested without a network. */

// The only place Traitor Mode's secrecy is actually enforced. The host's own
// local S always has the real idx/secretName — this only matters for what
// gets serialized into a message bound for a given connection. Everyone
// gets to know a traitor exists (S.traitor.active) and whether it's over
// (S.traitor.revealed); only the traitor's own connection ever gets to see
// *who*, before the reveal makes it moot for everyone.
function redactTraitor(state, forIdx){
  const clone=JSON.parse(JSON.stringify(state));
  const t=clone.traitor;
  if(t && t.active && !t.revealed && t.idx!==forIdx){
    // Not just "who" — "whether". Anyone but the traitor is handed a state
    // in which Traitor Mode was never switched on at all, counters included,
    // so a modified client has nothing to read either.
    t.active=false; t.awakened=false; t.idx=null; t.secretName=null;
    t.sabotageLeft=0; t.aidLeft=0; t.strikesLeft=0;
  }
  return clone;
}

const Net = {
  mode:"solo",          // solo | host | guest
  code:null, peer:null, conns:[], hostConn:null, myIdx:0,

  // Stable identity across reloads. Without this, every rejoin looked like a
  // brand-new player and the party filled with copies of the same character.
  pid(){
    try{
      let p=localStorage.getItem("barrow-pid");
      if(!p){ p=Array.from({length:12},()=>"abcdefghjkmnpqrstuvwxyz23456789"[R.int(31)]).join("");
              localStorage.setItem("barrow-pid", p); }
      return p;
    }catch(e){
      if(!Net._pid) Net._pid=Array.from({length:12},()=>"abcdefghjkmnpqrstuvwxyz23456789"[R.int(31)]).join("");
      return Net._pid;
    }
  },

  transport:{
    broadcast(msg){ Net.conns.forEach(c=>{ try{ c.send(msg); }catch(e){} }); },
    toHost(msg){ try{ Net.hostConn && Net.hostConn.send(msg); }catch(e){} },
    to(id,msg){ const c=Net.conns.find(x=>x.peer===id); if(c){ try{ c.send(msg); }catch(e){} } }
  },

  /* ---- host side ---- */
  hostReceive(msg, connId){
    if(Net.mode!=="host") return;
    if(msg.t==="join"){
      // THE DUPLICATE-CHARACTER FIX. A join is an identity claim, not always a
      // new character. Guests send a stable pid; a reload, a reconnect, or a
      // double-pressed Join button re-sends it, and the host REATTACHES the
      // existing character instead of minting another one.
      if(msg.pid){
        const back=S.party.findIndex(p=>p.pid===msg.pid);
        if(back>=0){
          const pc=PC(back);
          pc.conn=connId;
          pc.offline=false;
          if(pc.down && pc.hp<=0 && !S.fight){ pc.down=false; pc.hp=1; }
          Net.transport.to(connId,{t:"you", idx:back});
          // recap first, so it lands above the "finds the way back" line
          Net.transport.to(connId, {t:"state", S:redactTraitor(S, back), lines:introLines()});
          if(Music.url) Net.transport.to(connId, {t:"music", url:Music.url, from:Music.fromName});
          BUF = Net.mode==="host" ? [] : null;
          out(`<span class="sys">${pc.name} finds the way back to the party.</span>`);
          Net.push(); BUF=null;
          sync(); G.choices();
          return;
        }
      }
      // same live connection asking twice = one character, not two
      const dup=S.party.findIndex(p=>p.conn===connId);
      if(dup>=0){ Net.transport.to(connId,{t:"you", idx:dup}); Net.push(); return; }
      if(S.party.length>=4){ Net.transport.to(connId,{t:"full"}); return; }
      const nm=uniqueName(cleanName(msg.name)||R.pick(T.names), -1);
      const pc=newPC(nm,
        CLASSES[msg.cls]?msg.cls:"Fighter",
        ANCESTRIES[msg.anc]?msg.anc:"Human",
        BACKGROUNDS[msg.bg]?msg.bg:"Soldier",
        (msg.av && typeof msg.av.col==="number") ? {em:Math.max(-1,Math.min(EMBLEMS.length-1,msg.av.em|0)),
          col:Math.max(0,Math.min(AVCOLORS.length-1,msg.av.col|0)), seed:hashStr(nm)} : null);
      // Only a loaded favorite carries stats in; a fresh character is still
      // rolled here on the host, exactly as before.
      if(typeof msg.favId==="string" && msg.favId){
        applyProgress(pc, msg.prog);
        pc.favId=msg.favId.slice(0,40);
      }
      pc.conn=connId; pc.pid=msg.pid||null;
      S.party.push(pc);
      Net.transport.to(connId,{t:"you", idx:S.party.length-1});
      // recap first, so it lands above the "comes down the steps" line
      Net.transport.to(connId, {t:"state", S:redactTraitor(S, S.party.length-1), lines:introLines()});
      if(Music.url) Net.transport.to(connId, {t:"music", url:Music.url, from:Music.fromName});
      BUF = Net.mode==="host" ? [] : null;
      out(`<span class="sys">${pc.name} the ${pc.cls.toLowerCase()} comes down the steps.</span>`);
      Net.push(); BUF=null;
      sync(); G.choices();
      return;
    }
    if(msg.t==="rename" || msg.t==="avatar" || msg.t==="traitorname"){
      const idx=S.party.findIndex(p=>p.conn===connId);
      if(idx<0) return;
      Net.applyIdentity(idx, msg.t, msg);
      return;
    }
    if(msg.t==="chat"){
      const idx=S.party.findIndex(p=>p.conn===connId);
      if(idx<0) return;
      const text=String(msg.text||"").slice(0,300);
      if(!text.trim()) return;
      Chat.line(PC(idx).name, text);
      Net.transport.broadcast({t:"chat", from:PC(idx).name, text});
      return;
    }
    if(msg.t==="intent"){
      const idx=S.party.findIndex(p=>p.conn===connId);
      if(idx<0) return;
      G.perform(idx, msg.action, msg.arg, msg.target);
    }
  },

  // The host is the only thing that decides names and badges — same rule as
  // dice. A guest asks; the host cleans, de-duplicates and broadcasts.
  applyIdentity(idx, kind, msg){
    if(Net.mode==="guest") return;
    const pc=PC(idx); if(!pc) return;
    if(kind==="rename"){
      const want=cleanName(msg.name);
      if(!want) return;
      const was=pc.name;
      const name=uniqueName(want, idx);
      if(name===was) return;
      const ev=[{t:"rename", vs:idx, name, was}];
      if(pc.av && pc.av.em===-1) pc.av=autoAvatar(name);   // sigil follows the name
      BUF = Net.mode==="host" ? [] : null;
      apply(ev); out(Narrator.line(ev[0]));
      sync(); G.choices();
      if(Net.mode==="host"){ Net.push(); BUF=null; }
      return;
    }
    if(kind==="avatar"){
      const em=Math.max(-1, Math.min(EMBLEMS.length-1, msg.em|0));
      const col=Math.max(0, Math.min(AVCOLORS.length-1, msg.col|0));
      BUF = Net.mode==="host" ? [] : null;
      apply([{t:"avatar", vs:idx, em, col}]);
      sync();
      if(Net.mode==="host"){ Net.push(); BUF=null; }
    }
    if(kind==="traitorname"){
      // Only the real traitor's own claim can ever set this — a forged
      // message from anyone else silently does nothing.
      if(!S.traitor || idx!==S.traitor.idx) return;
      S.traitor.secretName=cleanName(msg.name)||"The Unmasked";
      if(Net.mode==="host"){ BUF=[]; Net.push(); BUF=null; }
    }
  },

  /* ---- guest side ---- */
  guestReceive(msg){
    if(msg.t==="you"){ Net.myIdx=msg.idx; return; }
    // Renames and badge changes reach guests inside the next "state" push,
    // not as messages of their own — there was a branch here that tried to
    // resolve a connection id that only exists on the host side, so it could
    // only ever have thrown. Guests apply identity from state, like everything else.
    if(msg.t==="chat"){ Chat.line(msg.from, msg.text); return; }
    if(msg.t==="music"){ Music.receiveShare(msg.url, msg.from); return; }
    if(msg.t==="traitorPick"){ G.traitorNameModal(); return; }
    if(msg.t==="traitorAwake"){ G.traitorAwakeModal(); return; }
    if(msg.t==="full"){ modal(`<h3>That party is full</h3><p>Four is the limit.</p>
      <button class="ch" onclick="closeModal()">Close</button>`); return; }
    if(msg.t==="state"){
      S=ensureTraitorField(msg.S); S.me=Net.myIdx;
      (msg.lines||[]).forEach(l => l.k==="h" ? scene(l.html) : out(l.html, true));
      sync(); G.choices();
      if(S.flags.dead) G.death(); else if(S.flags.won) G.victory();
    }
  },

  // Host sends state plus whatever prose was produced — identical text to
  // everyone, but the state itself is redacted per-recipient so Traitor
  // Mode's one secret never rides along on the broadcast (see redactTraitor).
  push(){
    if(Net.mode!=="host") return;
    const lines=BUF||[];
    Net.conns.forEach(c=>{
      const idx=S.party.findIndex(p=>p.conn===c.peer);
      try{ c.send({t:"state", S:redactTraitor(S, idx), lines}); }catch(e){}
    });
  },

  send(action, arg, target){ Net.transport.toHost({t:"intent", action, arg, target}); }
};

/* ---------------------------------------------------------------- chat --- */
/* Table talk rides the same connections as the game but never touches game
   state. Host relays every line so all four screens read identically. */
const Chat = {
  show(){ document.getElementById("chatbox").style.display=""; },
  line(from, text){
    const log=document.getElementById("chatlog");
    const p=document.createElement("p");
    const mine = S && S.party && S.party[S.me] && from===S.party[S.me].name;
    if(mine) p.className="cme";
    const who = S && S.party ? S.party.find(x=>x.name===from) : null;
    p.innerHTML=`${who?avatarSVG(who,16):""}<b>${escHtml(from)}:</b> ${escHtml(text)}`;
    log.appendChild(p);
    while(log.children.length>120) log.removeChild(log.firstChild);
    log.scrollTop=log.scrollHeight;
    // Only someone else's line gets a sound — you already know you sent
    // your own, and solo table-talk (muttering to yourself) never dings.
    if(!mine) SFX.chat();
  },
  send(){
    const t=document.getElementById("chattxt");
    const text=t.value.trim().slice(0,300);
    if(!text) return;
    t.value="";
    if(Net.mode==="host"){
      Chat.line(ME().name, text);
      Net.transport.broadcast({t:"chat", from:ME().name, text});
    } else if(Net.mode==="guest"){
      Net.transport.toHost({t:"chat", text});   // host echoes it back to everyone
    } else {
      Chat.line(ME()?ME().name:"You", text);    // solo: a place to mutter to yourself
    }
  }
};

/* -------------------------------------------------------------- music --- */
// Table music as a real embedded YouTube player — one independent instance
// per viewer. This only works because the game is served from a genuine
// https:// origin now, not opened as a local file: YouTube's embedded
// player validates the page's Referer/Origin before it'll play, and a
// file:// copy of this page can never send one (that mismatch, not any
// per-video restriction, was the true cause of the "error 153" this went
// through earlier). The host pastes a link and it's broadcast to every
// connected guest (and to anyone who joins/reconnects afterward); everyone
// then plays their own local embed with their own play/pause/volume —
// *which* track plays is host-controlled, but each person's playback is
// their own, so there's no network-lag position sync to fight.
const Music = {
  url:null, fromName:null, videoId:null, player:null, ready:false, wantPlay:false, usingFallback:false, vol:40,

  init(){
    let saved=null;
    try{ saved=JSON.parse(localStorage.getItem("barrow-music")||"null"); }catch(e){ saved=null; }
    if(saved && saved.url){
      this.url=saved.url;
      this.videoId=this.extractId(saved.url);
      this.vol = saved.vol!=null ? saved.vol : 40;
      document.getElementById("ytwrap").hidden = !!saved.hidden;
      document.getElementById("ytwrap").classList.toggle("min", !!saved.min);
      document.getElementById("ytwrap").classList.toggle("tucked", !!saved.tucked);
      if(!saved.hidden){ this.render(); this._spawn(); }
    }
  },

  extractId(url){
    // Validates it's a YouTube link AND gives us the bare video ID the
    // IFrame Player API needs to embed. The raw url (with any
    // list=/start_radio=/t= params) is what's stored/broadcast/opened, so
    // playlists and radio mixes still work for "open on YouTube instead".
    const m=/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/|live\/))([A-Za-z0-9_-]{6,15})/.exec(String(url||""));
    return m ? m[1] : null;
  },

  open(){
    const w=document.getElementById("ytwrap");
    if(!w.hidden && !w.classList.contains("tucked")){ this.tuck(true); return; }
    if(w.classList.contains("tucked") && (this.url || Net.mode==="guest")){ this.tuck(false); return; }
    if(Net.mode==="guest"){
      // Guests never paste their own link — they just see and play
      // whatever the host has shared (or a note that nothing's playing).
      document.getElementById("ytwrap").hidden=false;
      document.getElementById("ytwrap").classList.remove("min","tucked");
      this.render();
      if(this.videoId && !this.player) this._spawn();
      this._save();
      return;
    }
    if(this.url){
      document.getElementById("ytwrap").hidden=false;
      document.getElementById("ytwrap").classList.remove("min","tucked");
      this.render();
      if(this.videoId && !this.player) this._spawn();
      this._save();
      return;
    }
    modal(`<h3>Table music</h3>
      <p>Paste a YouTube link — a D&D ambient track, a lofi loop, whatever the table wants playing
         underneath. ${Net.mode==="host" ? "It'll be shared with everyone at the table — each person gets their own player with their own volume." : "It plays in your own little player, volume and all."}</p>
      <div class="namerow">
        <input id="yturl" placeholder="https://youtube.com/watch?v=…">
      </div>
      <div class="navrow">
        <button class="ch" onclick="closeModal()">Never mind</button>
        <button class="ch go" onclick="Music.submitURL()"><b>Share</b></button>
      </div>`);
  },

  submitURL(){
    const url=document.getElementById("yturl").value;
    const id=this.extractId(url);
    if(!id){ out(`<span class="hurt">That doesn't look like a YouTube link.</span>`); return; }
    this.url=url;
    this.videoId=id;
    this.fromName = ME() ? ME().name : "You";
    closeModal();
    document.getElementById("ytwrap").hidden=false;
    document.getElementById("ytwrap").classList.remove("min","tucked");
    this._save();
    this.render();
    this.wantPlay=true;
    this.clearError();
    if(this.player) this.player.loadVideoById(id); else this._spawn();
    if(Net.mode==="host"){
      Net.transport.broadcast({t:"music", url:this.url, from:this.fromName});
    }
  },

  // Called on a guest's screen when the host shares (or a joining/reconnecting
  // guest is caught up with) a track. Always wins over anything local, since
  // the host's link is the only one that matters for which track plays.
  receiveShare(url, from){
    const id=this.extractId(url);
    if(!id) return;
    this.url=url;
    this.videoId=id;
    this.fromName=from;
    document.getElementById("ytwrap").hidden=false;
    document.getElementById("ytwrap").classList.remove("min");
    this._save();
    this.render();
    this.wantPlay=false;   // don't force-autoplay on someone who didn't ask — they press play
    this.clearError();
    if(this.player) this.player.loadVideoById(id); else this._spawn();
  },

  render(){
    const note=document.getElementById("ytnote");
    const changeBtn=document.getElementById("ytchange");
    if(!note) return;
    if(!this.url){
      note.innerHTML = Net.mode==="guest"
        ? `Nobody's sharing music yet.`
        : `Nothing queued.`;
      if(changeBtn) changeBtn.hidden=true;
      return;
    }
    if(Net.mode==="guest"){
      note.innerHTML = `<b>${escHtml(this.fromName||"The host")}</b> shared this track — use the controls below to play it.`;
      if(changeBtn) changeBtn.hidden=true;   // guests don't control which link plays
    } else {
      note.innerHTML = `Sharing with the table.`;
      if(changeBtn) changeBtn.hidden=false;
    }
  },

  _spawn(){
    this.clearError();
    this.usingFallback=false;
    document.getElementById("ytctl").hidden=false;
    document.getElementById("ytvol").value=this.vol;
    if(!window.YT || !window.YT.Player){ this._pending=true; loadYT(); return; }
    if(this.player){ this.player.loadVideoById(this.videoId); return; }
    this.player=new YT.Player("ytplayer", {
      videoId:this.videoId, width:"100%", height:"100%",
      playerVars:{ playsinline:1, modestbranding:1, rel:0, origin:location.origin },
      events:{
        onReady:(e)=>{
          this.ready=true;
          this.clearError();
          e.target.setVolume(this.vol);
          if(this.wantPlay) e.target.playVideo();
        },
        onStateChange:(e)=>{
          const btn=document.getElementById("ytplay");
          if(!btn) return;
          btn.textContent = e.data===YT.PlayerState.PLAYING ? "⏸ Pause" : "▶ Play";
        },
        onError:(e)=>this.showError(e.data)
      }
    });
  },

  // 101/150 mean the uploader genuinely disabled embedding everywhere —
  // no client-side trick overrides that. Anything else, offer the same
  // "open on YouTube instead" escape hatch rather than a dead player.
  showError(code){
    const box=document.getElementById("ytmsg");
    box.hidden=false;
    const restricted = (code===101 || code===150);
    box.innerHTML = restricted
      ? `<span>This video's owner has disabled embedding, so it can't play here — but it'll still play normally on YouTube itself.</span>`
      : `<span>Couldn't play that embed here (error ${code}) — it'll still play normally on YouTube itself.</span>`;
    document.getElementById("ytopen").hidden=false;
    document.getElementById("ytctl").hidden=true;
  },
  clearError(){
    const box=document.getElementById("ytmsg");
    if(box){ box.hidden=true; box.innerHTML=""; }
    const openBtn=document.getElementById("ytopen");
    if(openBtn) openBtn.hidden=true;
  },

  openTab(){
    if(this.url) window.open(this.url, "_blank", "noopener");
  },

  toggle(){
    if(this.usingFallback) return;
    if(!this.player){ this.wantPlay=true; if(this.videoId) this._spawn(); return; }
    const st=this.player.getPlayerState();
    if(st===1) this.player.pauseVideo(); else { this.wantPlay=true; this.player.playVideo(); }
  },

  setVolume(v){
    this.vol=+v;
    if(this.player && this.player.setVolume) this.player.setVolume(+v);
    this._save();
  },

  changeTrack(){
    if(Net.mode==="guest") return;   // guests can't change the host's link
    this.url=null; this.videoId=null; this.fromName=null;
    try{ if(this.player && this.player.stopVideo) this.player.stopVideo(); }catch(e){}
    try{ localStorage.removeItem("barrow-music"); }catch(e){}
    this.render();
    this.open();
  },

  // Hide or show the player from the menu without stopping the music.
  tuck(on){
    const w=document.getElementById("ytwrap");
    this.place();
    w.classList.toggle("tucked", !!on);
    if(!on){ w.hidden=false; w.classList.remove("min"); }
    this._label();
    this._save();
  },

  // Keep the card just under the menu bar, which wraps to more rows on
  // narrow screens, so it never sits over the story or the Act button.
  place(){
    const t=document.getElementById("top");
    if(t) document.documentElement.style.setProperty("--yttop", (t.getBoundingClientRect().bottom+8)+"px");
  },

  _label(){
    const w=document.getElementById("ytwrap"), b=document.getElementById("musicbtn");
    if(!b) return;
    const showing = !w.hidden && !w.classList.contains("tucked");
    b.textContent = showing ? "🎵 Hide Music" : (this.url && !w.hidden ? "🎵 Show Music" : "🎵 Music");
  },

  toggleMin(){
    const w=document.getElementById("ytwrap");
    w.classList.toggle("min");
    this._save();
  },

  close(){
    if(this.player && this.player.stopVideo) try{ this.player.stopVideo(); }catch(e){}
    const w=document.getElementById("ytwrap");
    w.hidden=true; w.classList.remove("tucked");
    this.wantPlay=false;
    this._label();
    this._save();
  },

  _save(){
    const w=document.getElementById("ytwrap");
    try{ localStorage.setItem("barrow-music", JSON.stringify({
      url:this.url, hidden:w.hidden, min:w.classList.contains("min"), tucked:w.classList.contains("tucked"), vol:this.vol
    })); }catch(e){}
    this._label();
  }
};
// Lazy-loads the YouTube IFrame Player API script the same way loadPeer()
// lazy-loads PeerJS, only once a track is actually being played.
function loadYT(){
  if(window.YT && window.YT.Player) return;
  if(document.getElementById("yt-iframe-api")) return;
  const s=document.createElement("script");
  s.id="yt-iframe-api";
  s.src="https://www.youtube.com/iframe_api";
  document.head.appendChild(s);
}
// The YouTube API script calls this global once it has finished loading —
// if a track was waiting on it, spawn the player now.
function onYouTubeIframeAPIReady(){ if(Music._pending || Music.videoId) Music._spawn(); }

/* -------------------------------------------------------------- output --- */
let BUF=null;   // when non-null, prose is also captured for broadcast

function out(html, quiet){
  const l=document.getElementById("log");
  const p=document.createElement("p"); p.innerHTML=html; l.appendChild(p);
  l.scrollTop=l.scrollHeight;
  if(BUF && !quiet) BUF.push({k:"p", html});
  sfxForLine(html);
}

// Every narrated line — host-local or pushed to a guest — passes through
// out(). The narrator already tags outcomes as good/bad/whiff for player
// color (hit/hurt/miss); reading that back off the markup gives sound
// effects for free, in solo AND multiplayer, without threading raw event
// types through the network layer.
function sfxForLine(html){
  if(/is now level/.test(html)){ SFX.levelup(); return; }
  if(/stopper free and drinks|still sealed, still good/.test(html)){ SFX.potion(); return; }
  if(/\bfinds\b/.test(html) && /class="hit"/.test(html)){ SFX.loot(); return; }
  if(/class="hurt"/.test(html)){ SFX.bad(); return; }
  if(/class="hit"/.test(html)){ SFX.good(); return; }
  if(/class="miss"/.test(html)){ SFX.miss(); return; }
}
function scene(title){
  const l=document.getElementById("log");
  const h=document.createElement("h2"); h.className="scene"; h.textContent=title; l.appendChild(h);
  l.scrollTop=l.scrollHeight;
  if(BUF) BUF.push({k:"h", html:title});
}

// A joining or reconnecting guest's log starts completely empty — they get
// the state (hp, inventory, choices) but none of the prose that got the
// party there, including the opening scene. This hands them a recap of
// where things stand right now, read-only (no spawning, no state changes),
// so their screen isn't just a blank log and a wall of buttons.
function introLines(){
  const r=S.map[S.at];
  const lines=[{k:"h", html:r.n}];
  lines.push({k:"p", html:`The ${PLACE()} is ${r.adj}. ${r.f} ${r.det}`});
  if(S.fight) lines.push({k:"p", html:`<span class="hurt">${S.fight.the} is here — the fight is already on.</span>`});
  return lines;
}

/* -------------------------------------------------------------- engine --- */
const G = {
pending:null, pendingItem:null, manualDice:true, busy:false,

/* ---- character creation: a real multi-step creator ---- */
draft:null,

start(){
  try{ G.manualDice = localStorage.getItem("barrow-manualdice")!=="0"; }catch(e){ G.manualDice=true; }
  const db=document.getElementById("dicebtn");
  if(db) db.textContent = G.manualDice ? "🎲 Dice Rolls: On" : "🎲 Dice Rolls: Off";
  try{ SFX.on = localStorage.getItem("barrow-sfx")!=="0"; }catch(e){ SFX.on=true; }
  try{ DM.enabled = localStorage.getItem("barrow-aidm")!=="0"; }catch(e){ DM.enabled=true; }
  updateAiButtons();
  const sb=document.getElementById("sfxbtn");
  if(sb) sb.textContent = SFX.on ? "🔊 Sound: On" : "🔇 Sound: Off";
  Music.place();
  addEventListener("resize", ()=>Music.place());
  Music.init();
  Music._label();

  // Offer to pick back up a delve in progress. A finished run (dead or won)
  // is not something to resume into — that goes straight to a new character.
  let saved=null;
  try{
    const raw=localStorage.getItem("barrow");
    if(raw){
      const d=JSON.parse(raw);
      if(d && d.party && d.party[0] && d.party[0].anc && !(d.flags&&(d.flags.dead||d.flags.won))) saved=d;
    }
  }catch(e){ saved=null; }

  if(saved){
    modal(`<h3>Welcome back</h3>
      <p>Still down there: ${saved.party.map(p=>`${escHtml(p.name)}, level ${p.lvl} ${p.cls.toLowerCase()}`).join(", ")}.</p>
      <div class="pick">
        <button class="ch" onclick="G.resumeSave()"><b>Continue the delve</b></button>
        <button class="ch" onclick="closeModal(); G.newGame()"><b>Start a new character</b></button>
      </div>`, true);
    return;
  }
  G.newGame();
},

newGame(){
  G.draft={ name:R.pick(T.names), anc:"Human", cls:"Fighter", bg:"Soldier",
            dun:"barrow", av:null, step:0 };
  G.draft.av=autoAvatar(G.draft.name);
  G.creator();
},

resumeSave(){
  try{
    const d=JSON.parse(localStorage.getItem("barrow"));
    S=ensureTraitorField(d); S.me=Math.min(S.me||0, S.party.length-1);
    closeModal();
    document.getElementById("log").innerHTML="";
    out(`<span class="sys">Picking up where you left off — ${S.party.map(p=>`${p.name} (${p.lvl})`).join(", ")}.</span>`);
    G.describeRoom(false); sync();
  }catch(e){ closeModal(); G.newGame(); }
},

// One renderer for all five steps keeps the markup honest and the phone happy.
creator(){
  const d=G.draft;
  const steps=["Name","Ancestry","Class","Background","Look"];
  const nav=steps.map((s,i)=>
    `<button class="stp${i===d.step?" on":""}" onclick="G.step(${i})">${i+1}. ${s}</button>`).join("");

  let body="";
  if(d.step===0){
    const favs=Favorites.list();
    const favHtml = favs.length ? `<p><b>★ Your favorites</b> <span class="dim">— pick a dungeon below, then play one. Saved on this device.</span></p>
      <div class="favlist">${favs.map(f=>`<div class="favrow">
        ${avatarSVG({name:f.name, av:f.av}, 30)}
        <div class="favtxt"><b>${escHtml(f.name)}</b><br><span class="dim">Level ${f.lvl|0} ${escHtml(f.anc)} ${escHtml(String(f.cls).toLowerCase())} · ${escHtml(String(f.bg).toLowerCase())}</span></div>
        <button class="ch go" onclick="G.playFavorite('${escAttr(f.id)}')"><b>Play</b></button>
        <button class="ch" title="Remove" onclick="G.removeFavorite('${escAttr(f.id)}')">✕</button>
      </div>`).join("")}</div><p style="margin-top:14px">Or make someone new:</p>` : "";

        `<button class="ch${d.dun===k?" sel":""}" onclick="G.pick('dun','${k}')">
           <b>${v.name}</b><br><span class="dim">${v.hook}</span></button>`).join("")}</div>`;
  }
  else if(d.step===1){
    body=`<p>Ancestry nudges your numbers and gives you one thing that is actually yours.</p>
      <div class="pick">${Object.entries(ANCESTRIES).map(([k,v])=>
        `<button class="ch${d.anc===k?" sel":""}" onclick="G.pick('anc','${k}')">
           <b>${k}</b> — ${v.blurb}<br>
           <span class="dim">${bumpText(v.bump, d.cls)} · <em>${v.trait}:</em> ${v.tdesc}</span></button>`).join("")}</div>`;
  }
  else if(d.step===2){

      <div class="pick">${Object.entries(CLASSES).map(([k,v])=>

           <b>${k}</b> — ${v.blurb}<br>
           <span class="dim">d${v.hd} hit die · AC ${v.ac} · ${v.wpn.name} ·
           <em>${v.power.name}:</em> ${v.power.desc}</span></button>`).join("")}</div>`;
  }
  else if(d.step===3){
    body=`<p>What you did before the barrow. It still counts for something.</p>
      <div class="pick">${Object.entries(BACKGROUNDS).map(([k,v])=>
        `<button class="ch${d.bg===k?" sel":""}" onclick="G.pick('bg','${k}')">
           <b>${k}</b> — ${v.blurb}<br>
           <span class="dim">${v.skill} · ${v.item} · <em>${v.trait}:</em> ${v.tdesc}</span></button>`).join("")}</div>`;
  }
  else {
    body=`<p>A sigil is drawn from your name. Take it, or pick a device and a colour.</p>
      <div class="avprev">${avatarSVG({name:d.name, av:d.av}, 72)}
        <div><b>${escHtml(d.name)}</b><br><span class="dim">${d.anc} ${d.cls.toLowerCase()} · ${d.bg.toLowerCase()}</span></div></div>
      <div class="emgrid">
        <button class="em${d.av.em===-1?" sel":""}" onclick="G.pickEm(-1)" title="Sigil from your name">
          ${avatarSVG({name:d.name, av:{em:-1,col:d.av.col,seed:hashStr(d.name)}}, 34)}</button>
        ${EMBLEMS.map((e,i)=>`<button class="em${d.av.em===i?" sel":""}" onclick="G.pickEm(${i})" title="${e.n}">
          ${avatarSVG({name:d.name, av:{em:i,col:d.av.col}}, 34)}</button>`).join("")}
      </div>

        `<button class="col${d.av.col===i?" sel":""}" style="background:${c}" onclick="G.pickCol(${i})"></button>`).join("")}</div>`;
  }

  const last = d.step===4;
  modal(`<h3>${DUNGEONS[d.dun].name}</h3>

step(i){ G.draft.step=Math.max(0,Math.min(4,i)); G.creator(); },

// Quick start: skip the creator entirely. Used by the "Surprise me" button
// and by the automated test suites.
chose(cls, anc, bg, dun, name){
  const c = CLASSES[cls] ? cls : R.pick(Object.keys(CLASSES));
  const a = ANCESTRIES[anc] ? anc : R.pick(Object.keys(ANCESTRIES));
  const g = BACKGROUNDS[bg] ? bg : R.pick(Object.keys(BACKGROUNDS));
  const d = DUNGEONS[dun] ? dun : "barrow";
  G.draft={ name: cleanName(name) || R.pick(T.names), cls:c, anc:a, bg:g, dun:d, step:4 };
  G.draft.av=autoAvatar(G.draft.name);
  G.begin();
},
pick(k,v){
  G.draft[k]=v;
  if(k==="cls" || k==="anc") { /* preview text depends on both */ }
  G.creator();
},
draftName(v){
  G.draft.name=v;
  if(G.draft.av.em===-1) G.draft.av=autoAvatar(v||"?");
},
rollName(){
  G.draft.name=R.pick(T.names);
  if(G.draft.av.em===-1) G.draft.av=autoAvatar(G.draft.name);
  G.creator();
},
pickEm(i){ G.draft.av={...G.draft.av, em:i, seed:hashStr(G.draft.name)}; G.creator(); },
pickCol(i){ G.draft.av={...G.draft.av, col:i}; G.creator(); },

begin(){
  const d=G.draft;
  const name=cleanName(d.name) || R.pick(T.names);
  const pc=newPC(name, d.cls, d.anc, d.bg, {...d.av});
  S=newWorld(pc, d.dun);
  closeModal();
  document.getElementById("log").innerHTML="";
  out(`<span class="sys">${name} — ${d.anc} ${d.cls.toLowerCase()}, ${d.bg.toLowerCase()}. `+
      `${pc.hpMax} hit points, AC ${pc.ac}. ${ANCESTRIES[d.anc].trait} and ${BACKGROUNDS[d.bg].trait}.</span>`);
  G.tryOllama(false);
  G.describeRoom(true);
  sync();
},

// The AI Dungeon Master's move for a room the party has just entered quietly.
// Runs inside perform()'s busy lock, so nothing else can act while it thinks.
async dmTurn(){
  if(!DM.on() || S.flags.dead || S.flags.won || S.fight) return;
  if(S.at===S.map.length-1) return;                       // the vault is the boss's
  const L=DM.ledger(), key=`${S.dun}:${S.at}${S.flags.crown?":out":""}`;
  if(L.rooms[key]) return;
  L.rooms[key]=1;
  const allowed=DM.allowedMoves(), mons=DM.tier(), LOOT=["Oil flask","a valuable","a rusty key"];
  dot("busy");
  const res=await DM.call("dm", {...DM.snapshot(), ALLOWED_MOVES:allowed,
    MONSTERS:mons.map(k=>({key:k, name:MONSTERS[k].name})), LOOT});
  dot(Narrator.ollama?"on":"");
  if(!res || !allowed.includes(res.move) || S.fight || S.flags.dead) return;
  const r=S.map[S.at], live=conscious();
  const tgt = live.includes(res.target) ? res.target : (live.length ? R.pick(live) : null);
  const line=String(res.line||"").trim();
  const ev=[];
  switch(res.move){
    case "wander":
      L.wander++; ev.push({t:"dmwander", key: mons.includes(res.monster) ? res.monster : R.pick(mons)}); break;
    case "trap": {
      if(tgt===null) break;
      L.trap++;
      const c=Rules.check(tgt,"dex",12, skilledIn(PC(tgt),"acrobatics"));
      ev.push({t:"dmtrap", vs:tgt, roll:c});
      // A DM's trap stings but never knocks anyone out on its own.
      const dmg=Math.min(R.d(6), PC(tgt).hp-1);
      if(!c.ok && dmg>0) ev.push({t:"scrape", vs:tgt, dmg});
      break;
    }
    case "loot": {
      L.loot++;
      const d=LOOT.includes(res.detail) ? res.detail : "a valuable";
      ev.push({t:"dmhide", what: d==="Oil flask" ? "Oil flask" : d==="a rusty key" ? KEY_ITEM : R.pick(T.treasure)});
      break;
    }
    case "boon": {
      if(tgt===null) break;
      L.boon++;
      const p=PC(tgt);
      ev.push(p.hp<p.hpMax ? {t:"heal", vs:tgt, amt:R.d(6)+p.lvl} : {t:"edge", vs:tgt});
      break;
    }
  }
  if(line) ev.unshift({t:"dmsay", text:line, verbatim:true});
  if(!ev.length) return;
  if(Net.mode==="host") BUF=[];
  apply(ev);
  await Narrator.render(ev, r.n);
  const w=ev.find(e=>e.t==="dmwander");
  if(w){
    const m=spawn(w.key);
    S.fight={...m}; S.round=1; S.acted=[]; S.active=conscious()[0]??0;
    fightStart();
    out(`<span class="hurt">${m.the} — ${m.fl}.</span>`);
  }
  sync(); G.choices(); G.finish();
},

describeRoom(first){
  const r=S.map[S.at];
  scene(r.n);
  const D=DUNGEONS[S.dun];
  if(S.flags.waking)
    out(`You come back through ${r.n.toLowerCase()}. It is not as you left it — the ${r.adj} air has gone
         thin and moving, and what you are carrying is very cold.`);
  else
    out(`${first?(D.enter||`The steps end and ${D.short} begins.`)+" ":""}The ${PLACE()} is ${r.adj}. ${r.f} ${r.det}`);
  if(lockHint(r)) out(lockHint(r));

  if(r.mob && !r.cleared){
    const m=spawn(r.mob);
    if(m.boss){
      const hurtOnes=S.party.filter(p=>p.hp<p.hpMax||p.down);
      S.party.forEach(p=>{ p.down=false; p.hp=p.hpMax;
        p.power.uses=Math.max(p.power.uses, Math.ceil(CLASSES[p.cls].power.uses/2)); });
      if(hurtOnes.length)
        out(`<span class="hit">Nothing moves. For the first time since the steps, nothing moves at all.
             You bind what needs binding and get your breath back — everyone to full, and enough left
             for one more trick each.</span>`);
    }
    S.fight={...m}; S.round=1; S.acted=[]; S.active=conscious()[0]??0;
    fightStart();
    out(`<span class="hurt">${m.the} is here — ${m.fl}. It has seen you.</span>`);
  } else {
    out(`<span class="sys">You hear ${R.pick(DUNGEONS[S.dun].sound||T.sound)}.</span>`);
    S.acted=[]; S.active=conscious()[0]??0;
  }
  // A rare, unattributed shiver. It fires at the same rate in every party,
  // traitor or no traitor — gated on Traitor Mode it was a tell, because a
  // table that never saw one could conclude nobody had been chosen.
  if(S.party.length>1 && R.d(6)===1)
    out(`<span class="sys">${R.pick(T.traitorHint)}</span>`);
  G.choices();
},

/* ---- intent entry point ---- */
act(action, arg, target){
  if(Net.mode==="guest"){ Net.send(action, arg, target); return; }
  return G.perform(S.me, action, arg, target);
},

/* ---- dice-roll ceremony -------------------------------------------------
   Every action below already resolves on a d20 (or d6, for the oracle)
   check buried in Rules — the math never changes. This just makes the
   player press a button and watch the die tumble before the result is
   revealed, the way it would land on a table. Programmatic callers (tests,
   AI policies, network replays) go straight through G.act and never see
   this — it's a human-facing ceremony only. */
ROLL_POWERS: ["Sneak Attack","Hunter's Mark","Divine Smite"],
ROLL_LABEL: {attack:"the attack", power:"the strike", flee:"the escape",
  search:"the search", talk:"the talk", pray:"the prayer", hide:"the hide",
  freeform:"what happens"},

rollsDice(action){
  if(["attack","flee","search","talk","pray","hide","freeform"].includes(action)) return true;
  if(action==="power"){ const me=ME(); return !!me && G.ROLL_POWERS.includes(me.power.name); }
  return false;
},

toggleDice(){
  G.manualDice = !G.manualDice;
  try{ localStorage.setItem("barrow-manualdice", G.manualDice?"1":"0"); }catch(e){}
  const b=document.getElementById("dicebtn");
  if(b) b.textContent = G.manualDice ? "🎲 Dice Rolls: On" : "🎲 Dice Rolls: Off";
},

toggleDM(){
  DM.enabled=!DM.enabled;
  try{ localStorage.setItem("barrow-aidm", DM.enabled?"1":"0"); }catch(e){}
  updateAiButtons();
  out(`<span class="sys">🎭 AI Dungeon Master ${DM.enabled
    ? (Narrator.ollama&&Narrator.backend==="cloud" ? "on — it will run rooms and rule on unusual actions. Dice still decide." : "on — it takes part once Cloud AI is connected.")
    : "off — the game runs every room itself again."}</span>`, true);
},
toggleSfx(){
  SFX.on = !SFX.on;
  try{ localStorage.setItem("barrow-sfx", SFX.on?"1":"0"); }catch(e){}
  const b=document.getElementById("sfxbtn");
