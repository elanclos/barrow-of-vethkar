// identity changes are host-authoritative just like everything else
send(kind, payload){
  if(Net.mode==="guest"){ Net.transport.toHost({t:kind, ...payload}); return; }
  Net.applyIdentity(S.me, kind, payload);
},

describeRoom(first){
  const r=S.map[S.at];
  scene(r.n);
  const D=DUNGEONS[S.dun];
  if(S.flags.waking)
    out(`You come back through ${r.n.toLowerCase()}. It is not as you left it — the ${r.adj} air has gone
         thin and moving, and what you are carrying is very cold.`);
  else
    out(`${first?(D.enter||`The steps end and ${D.short} begins.`)+" ":""}The ${PLACE()} is ${r.adj}. ${r.f} ${r.det}`);

  if(r.mob && !r.cleared){
    const m=spawn(r.mob);
    if(m.boss){
      const hurtOnes=S.party.filter(p=>p.hp<p.hpMax||p.down);
      S.party.forEach(p=>{ p.down=false; p.hp=p.hpMax;
        p.power.uses=Math.max(p.power.uses, Math.ceil(CLASSES[p.cls].power.uses/2)); });
      if(hurtOnes.length)
        out(`<span class="hit">Nothing moves. For the first time since the steps, nothing moves at all.
             You bind what needs binding and get your breath back — everyone to full, and enough left
             for one more trick each.</span>`);
    }
    S.fight={...m}; S.round=1; S.acted=[]; S.active=conscious()[0]??0;
    S.party.forEach(p=>{ p.lucky=true; p.rage=0; });
    out(`<span class="hurt">${m.the} is here — ${m.fl}. It has seen you.</span>`);
  } else {
    out(`<span class="sys">You hear ${R.pick(DUNGEONS[S.dun].sound||T.sound)}.</span>`);
    S.acted=[]; S.active=conscious()[0]??0;
  }
  // A rare, unattributed shiver. It fires at the same rate in every party,
  // traitor or no traitor — gated on Traitor Mode it was a tell, because a
  // table that never saw one could conclude nobody had been chosen.
  if(S.party.length>1 && R.d(6)===1)
    out(`<span class="sys">${R.pick(T.traitorHint)}</span>`);
  G.choices();
},

/* ---- intent entry point ---- */
act(action, arg, target){
  if(Net.mode==="guest"){ Net.send(action, arg, target); return; }
  return G.perform(S.me, action, arg, target);
},

/* ---- dice-roll ceremony -------------------------------------------------
   Every action below already resolves on a d20 (or d6, for the oracle)
   check buried in Rules — the math never changes. This just makes the
   player press a button and watch the die tumble before the result is
   revealed, the way it would land on a table. Programmatic callers (tests,
   AI policies, network replays) go straight through G.act and never see
   this — it's a human-facing ceremony only. */
ROLL_POWERS: ["Sneak Attack","Hunter's Mark","Divine Smite"],
ROLL_LABEL: {attack:"the attack", power:"the strike", flee:"the escape",
  search:"the search", talk:"the talk", pray:"the prayer", hide:"the hide",
  freeform:"what happens"},

rollsDice(action){
  if(["attack","flee","search","talk","pray","hide","freeform"].includes(action)) return true;
  if(action==="power"){ const me=ME(); return !!me && G.ROLL_POWERS.includes(me.power.name); }
  return false;
},

toggleDice(){
  G.manualDice = !G.manualDice;
  try{ localStorage.setItem("barrow-manualdice", G.manualDice?"1":"0"); }catch(e){}
  const b=document.getElementById("dicebtn");
  if(b) b.textContent = G.manualDice ? "🎲 Dice Rolls: On" : "🎲 Dice Rolls: Off";
},

toggleSfx(){
  SFX.on = !SFX.on;
  try{ localStorage.setItem("barrow-sfx", SFX.on?"1":"0"); }catch(e){}
  const b=document.getElementById("sfxbtn");
  if(b) b.textContent = SFX.on ? "🔊 Sound: On" : "🔇 Sound: Off";
  if(SFX.on) SFX.click();
},

/* ---- UI entry point: gates roll-actions behind a press, passes the rest
   straight through to act(). Use this from buttons/typed input; use act()
   directly for anything programmatic. */
attempt(action, arg, target){
  if(!G.manualDice || !S || !G.rollsDice(action)) return G.act(action, arg, target);
  const box=document.getElementById("choices");
  if(!box) return G.act(action, arg, target);
  box.className="gate";
  box.innerHTML = `<div class="rollgate">
      <button id="diebtn" class="die" title="Roll the die">🎲</button>
      <span class="rollprompt">Press the die to resolve <b>${G.ROLL_LABEL[action]||"this"}</b>.</span>
      <button class="rollskip" id="rollskip">skip the ceremony</button>
    </div>`;
  document.getElementById("txt").disabled=true;
  document.getElementById("go").disabled=true;
  const resolve=()=>{ box.className=""; G.act(action, arg, target); };
  document.getElementById("rollskip").onclick=resolve;
  const die=document.getElementById("diebtn");
  die.onclick=()=>{
    die.disabled=true; die.classList.add("spin");
    const faces="⚀⚁⚂⚃⚄⚅";
    let n=0;
    const spin=setInterval(()=>{ die.textContent=faces[R.int(6)]; SFX.diceTick(); if(++n>=9){ clearInterval(spin); SFX.diceLand(); resolve(); } }, 55);
  };
},

/* ---- the authoritative turn ---- */
async perform(a, action, arg, target){
  if(!S || S.flags.dead || S.flags.won) return;
  // darkstrike is here too: the revealed traitor isn't in the turn order
  // any more (conscious() excludes them), so it needs the same exemption
  // from both the busy-lock and the "wait your turn" check below.
  const FREEBIES=["query","inv","cmds","look","listen","noSuch","darkstrike"];
  // A turn can take a few seconds to settle (an awaited local-AI narration
  // call, say) — without this guard, an impatient second click or keypress
  // before it does would run a second perform() concurrently with the
  // first, and both race on the same shared state. That race is exactly
  // what could leave the sheet stuck on stale numbers even though the game
  // had already moved on underneath it, or throw mid-turn outright.
  if(G.busy && !FREEBIES.includes(action)){
    if(a===S.me) out(`<span class="sys">Still catching up on the last turn — one moment.</span>`);
    return;
  }
  const lock = !FREEBIES.includes(action);
  if(lock) G.busy=true;
  try{

  if(PC(a).down && action!=="query" && action!=="inv" && action!=="cmds"){
    if(a===S.me) out(`<span class="sys">${PC(a).name} is on the floor. Someone else will have to.</span>`);
    return;
  }
  // In combat, turn order is enforced. Out of combat, anyone may act.
  if(S.fight && !FREEBIES.includes(action) && S.active!==a){
    if(a===S.me) out(`<span class="sys">Wait — it is ${PC(S.active).name}'s turn.</span>`);
    return;
  }

  if(Net.mode==="host") BUF=[];
  const r=S.map[S.at];
  let ev=[], spent=false;

  switch(action){
    case "attack":
      if(!S.fight){ out(`<span class="sys">There is nothing here to fight.</span>`); break; }
      ev=Rules.attack(a, S.fight); spent=true; break;

    case "power": {
      const pc=PC(a);
      if(!S.fight && pc.power.name!=="Second Wind"){ out(`<span class="sys">Nothing to aim it at.</span>`); break; }
      if(pc.power.name==="Second Wind" && pc.hp>=pc.hpMax){
        out(`<span class="sys">${pc.name} is unhurt. Save it.</span>`); break; }
      ev=Rules.power(a, S.fight||{name:"the dark",ac:10}); spent=true; break;
    }

    case "potion": {
      const pc=PC(a);
      if(pc.potions<=0){ out(`<span class="sys">No potions left.</span>`); break; }
      if(pc.hp>=pc.hpMax){ out(`<span class="sys">${pc.name} is unhurt. Save it.</span>`); break; }
      ev=[{t:"potion", src:a, amt:R.dice(2,4)+2}]; spent=true; break;
    }

    case "revive": {
      const t=(target!==undefined&&target!==null)?target:S.party.findIndex(p=>p.down);
      if(t<0 || !PC(t) || !PC(t).down){ out(`<span class="sys">Nobody is down.</span>`); break; }
      if(PC(a).potions<=0){ out(`<span class="sys">No potion to give them.</span>`); break; }
      ev=Rules.revive(a, t); spent=true; break;
    }

    case "flee":
      if(!S.fight){ out(`<span class="sys">Nothing is chasing you.</span>`); break; }
      ev=Rules.flee(a, S.fight); spent=true; break;

    case "move":
      if(S.fight){ out(`<span class="hurt">It is between you and the way on.</span>`); break; }
      if(S.flags.crown){
        if(S.at<=0) ev=[{t:"won"}];
        else ev=[{t:"move", to:S.at-1}];
      } else if(S.at>=S.map.length-1){
        out(`<span class="sys">You are not leaving without ${DUNGEONS[S.dun].goal}.</span>`);
      } else ev=[{t:"move", to:S.at+1}];
      break;

    case "search":
      if(S.fight){ out(`<span class="hurt">Not while that is looking at you.</span>`); break; }
      if(r.searched){ out(`<span class="sys">Already been over this one.</span>`); break; }
      ev=Rules.search(a, r); break;

    case "rest":
      if(S.fight){ out(`<span class="hurt">You will not be resting.</span>`); break; }
      ev=Rules.rest(a); break;

    case "take":
      if(S.at===S.map.length-1 && !S.flags.crown && !S.fight) ev=[{t:"crown", src:a}];
      else out(`<span class="sys">Nothing here comes loose.</span>`);
      break;

    case "look":
      out(`${r.f} ${r.det} ${S.fight
        ? `<span class="hurt">${S.fight.the} has not moved. It is waiting for you to.</span>`
        : (S.flags.crown?`Behind you, the way you came. It is longer than you remember.`
                        :`Ahead, the passage continues down.`)}`);
      break;

    case "listen": out(`<span class="sys">You hear ${R.pick(DUNGEONS[S.dun].sound||T.sound)}.</span>`); break;
    case "inv":    G.sheet(); break;
    case "cmds":   G.help(); break;
    case "query":  out(answerQuery(String(arg||"").toLowerCase().replace(/[^a-z0-9' ]/g," ").split(/\s+/).filter(Boolean))); break;

    case "noSuch": {
      const me=PC(a);
      out(`<span class="sys">No such thing. ${me.name} carries: ${me.inv.join(", ")}`+
          `${me.potions?`, and ${me.potions} potion${me.potions===1?"":"s"}`:""}. `+
          `The one ability is <b>${me.power.name}</b> — type <em>cast</em>.</span>`);
      break;
    }

    case "wait":
      out(`<span class="sys">${PC(a).name} holds still and lets the moment go past.</span>`);
      if(S.fight) spent=true;
      break;

    // A specific, mechanically-real item use (see ITEM_EFFECTS) — the item
    // name rides in on `target`, same slot revive uses for a party index,
    // just a different type for a different action. Never trusts the
    // caller: re-checks the item is actually still in inventory and that
    // its kind matches what perform() knows how to do with it, so a stale
    // button click (item already thrown last round) or a forged message
    // from a modified guest client can't do anything.
    case "useItem": {
      const pc=PC(a), item=target, eff=item && ITEM_EFFECTS[item];
      if(!eff || !pc.inv.includes(item)) break;
      if(eff.kind==="throw" && S.fight){ ev=Rules.throwItem(a, S.fight, item); spent=true; }
      else if(eff.kind==="scatter" && S.fight){ ev=Rules.scatterCaltrops(a, item); spent=true; }
      break;
    }

    case "talk": ev=Rules.talk(a, S.fight); spent=true; break;
    case "pray": ev=Rules.pray(a); spent=true; break;
    case "hide": ev=Rules.hide(a, S.fight); spent=true; break;

    case "freeform":
      out(`<span class="sys">The rules have no entry for that, so ${DUNGEONS[S.dun].short} decides.</span>`);
      ev=Rules.freeform(a, arg, G.pendingItem);
      G.pendingItem=null; spent=true;
      if(ev[0] && !ev[0].o.yes && ev[0].roll.fumble) ev.push({t:"note", text:`And then ${Oracle.twist()}.`});
      break;

    // ---- traitor mode: secret actions, visible only on the traitor's own
    // screen. Both reuse ordinary event types (scrape/heal) so the shared
    // log reads as plain bad luck or a lucky break — nothing points at
    // anyone, which is the entire point.
    // The traitor's own decision to stop being one of you. Only reachable
    // from their screen, only after the real boss has fallen, and never
    // forced — declining simply means the button is still there next turn.
    case "traitorTurn": {
      if(!S.traitor || !S.traitor.active || S.traitor.revealed) break;
      if(S.traitor.idx!==a || !S.traitor.awakened) break;
      G.revealTraitor();
      break;
    }
    case "traitorSabotage": {
      if(!S.traitor || S.traitor.idx!==a || (S.traitor.sabotageLeft||0)<=0) break;
      S.traitor.sabotageLeft--;
      const others=S.party.map((p,i)=>i).filter(i=>i!==a && !PC(i).down && !PC(i).isBoss);
      if(others.length){ const t=R.pick(others); ev=[{t:"scrape", vs:t, dmg:R.d(4)+1}]; }
      spent=true; break;
    }
    case "traitorAid": {
      if(!S.traitor || S.traitor.idx!==a || (S.traitor.aidLeft||0)<=0) break;
      S.traitor.aidLeft--;
      const hurt=S.party.map((p,i)=>i).filter(i=>!PC(i).down && !PC(i).isBoss && PC(i).hp<PC(i).hpMax);
      if(hurt.length){ const t=R.pick(hurt); ev=[{t:"heal", vs:t, amt:R.d(6)+2}]; }
      else ev=[{t:"edge", vs:a}];
      spent=true; break;
    }
    // The revealed traitor's bonus move — off the normal turn cycle
    // entirely (see FREEBIES above), on top of the engine's own automatic
    // attack each round. Reuses the ordinary "hit" event so it narrates
    // exactly like any other blow landing.
    case "darkstrike": {
      if(!S.fight || !S.traitor || !S.traitor.revealed || S.traitor.idx!==a || (S.traitor.strikesLeft||0)<=0) break;
      S.traitor.strikesLeft--;
      const targets=conscious();
      if(targets.length){
        const t=R.pick(targets);
        ev=[{t:"hit", src:"mob", vs:t, who:S.fight.name, dmg:R.dice(2,6)+3, crit:false, auto:true}];
      }
      spent=false; break;
    }
  }

  if(ev.length){
    apply(ev);
    await Narrator.render(ev, r.n);
  }
  await G.resolve(a, ev, spent);

  } finally {
    if(lock) G.busy=false;
  }
},

/* ---- post-turn ---- */
async resolve(a, ev, spent){
  const r=S.map[S.at];

  if(S.fight && S.fight.hp<=0){
    out(`<span class="hit">${S.fight.the} comes apart and does not get up.</span>`);
    const g=[{t:"xp", amt:S.fight.xp}];
    apply(g); await Narrator.render(g, r.n);
    const boss=S.fight.boss;
    S.fight=null; r.cleared=true; S.acted=[];
    S.party.forEach(p=>{ p.rage=0; });          // rage ends with the fight
    // whoever was down gets dragged up once the fighting stops
    const up=S.party.filter(p=>p.down);
    if(up.length){ up.forEach(p=>{ p.down=false; p.hp=1; });
      out(`<span class="hit">${up.map(p=>p.name).join(" and ")} get${up.length>1?"":"s"} hauled upright — one hit point and a bad hour ahead.</span>`); }
    if(boss){
      out(`<span class="hit">The crown is unguarded now.</span>`);
      // The traitor is not dragged out of hiding by the boss dying any more.
      // They are simply told, on their own screen, that the door is open —
      // and they walk through it whenever they choose, or never.
      if(S.traitor && S.traitor.active && !S.traitor.revealed && !S.traitor.awakened){
        S.traitor.awakened=true;
        G.notifyTraitorAwake();
      }
    }
  }

  if(ev.some(e=>e.t==="wandering"||e.t==="noise") && !S.fight){
    const m=spawn(rollMob(S.at)||"rat");
    S.fight={...m}; S.round=1; S.acted=[]; S.active=conscious()[0]??0;
    S.party.forEach(p=>{ p.lucky=true; p.rage=0; });
    out(`<span class="hurt">Something found you. ${m.the} — ${m.fl}.</span>`);
  }

  if(ev.some(e=>e.t==="move")){ G.describeRoom(false); sync(); G.finish(); return; }

  // turn order + the monster's swing
  if(S.fight && S.fight.hp>0 && !S.flags.dead){
    if(spent && !S.acted.includes(a)) S.acted.push(a);
    const alreadyActed=ev.some(e=>e.mAct);
    const live=conscious();
    const pending=live.filter(i=>!S.acted.includes(i));
    if(pending.length){
      S.active=pending[0];
    } else {
      S.acted=[]; S.active=live[0]??0; S.round++;
      if(!alreadyActed){
        const mev=Rules.monsterTurn(S.fight);
        apply(mev); await Narrator.render(mev, r.n);
      }
    }
  }

  // Never leave the turn parked on someone who cannot act. Solo could not
  // expose this; with a party, downing the active character stalled the round.
  if(S.fight && S.fight.hp>0){
    const live=conscious();
    if(live.length && !live.includes(S.active)){
      const pending=live.filter(i=>!S.acted.includes(i));
      if(pending.length) S.active=pending[0];
      else{
        S.acted=[]; S.active=live[0]; S.round++;
        const mev=Rules.monsterTurn(S.fight);
        apply(mev); await Narrator.render(mev, r.n);
      }
    }
  }

  // One desperate reprieve per character — but only when going down would end
  // the whole party. With allies still up, down is down; they can pick you up.
  if(partyWiped()){
    const cand=S.party.map((p,ix)=>ix).filter(i=>!PC(i).stand);
    if(cand.length){
      const i=cand[0];
      PC(i).stand=true;                      // one attempt, win or lose
      const roll=Rules.lastStand(i);
      if(roll.ok){ const sev=[{t:"stand", vs:i, roll}]; apply(sev); await Narrator.render(sev, r.n);
                   if(S.fight) S.active=i; }
    }
  }
  if(partyWiped()) S.flags.dead=true;
  else if(!conscious().includes(S.active)) S.active=conscious()[0]??S.active;

  if(S.flags.dead){ G.death(); G.finish(); return; }
  if(S.flags.won){ G.victory(); G.finish(); return; }
  sync(); G.choices(); G.finish();
},

finish(){ if(Net.mode==="host"){ Net.push(); BUF=null; } },

/* ---- traitor mode ----------------------------------------------------
   The one piece of hidden information the engine has ever needed to keep:
   who the traitor is, and what they've named the thing they'll become.
   Both live in S.traitor so they save/load/resume exactly like everything
   else — the secrecy isn't "don't put it in state", it's "redact it before
   it goes out over the wire to anyone but the traitor themselves"
   (see redactTraitor, and Net.push). Locally, every render checks
   S.traitor.idx===S.me before showing anything traitor-related, so a
   guest's own screen can never leak someone else's role even though the
   host's full S technically knows it. */
toggleTraitorMode(){
  if(Net.mode==="guest" || !S) return;
  ensureTraitorField(S);
  BUF = Net.mode==="host" ? [] : null;
  if(S.traitor.active){
    if(S.traitor.revealed){ out(`<span class="sys">Too late for that now.</span>`); }
    else{
      S.traitor.active=false; S.traitor.awakened=false; S.traitor.idx=null; S.traitor.secretName=null;
      out(`<span class="sys">Traitor Mode is off.</span>`, true);   // host's screen only
    }
  } else {
    if(S.party.length<2){ out(`<span class="sys">Needs at least two in the party for that.</span>`); }
    else{
      S.traitor.active=true; S.traitor.revealed=false; S.traitor.awakened=false; S.traitor.secretName=null;
      S.traitor.idx=R.int(S.party.length);
      S.traitor.sabotageLeft=3; S.traitor.aidLeft=3; S.traitor.strikesLeft=3;
      // Host's screen only. Broadcasting this told the whole table a traitor
      // existed, which is half the secret given away at the moment of arming.
      out(`<span class="sys">Traitor Mode is on. Something has changed among you, though nothing shows on any face.</span>`, true);
    }
  }
  sync(); G.choices();
  if(Net.mode==="host"){ Net.push(); BUF=null; }
  if(S.traitor.active && S.traitor.idx!=null) G.promptTraitorName();
},

// Tells the traitor, and only the traitor, that the moment is theirs now.
notifyTraitorAwake(){
  const idx=S.traitor.idx;
  if(idx===S.me){ G.traitorAwakeModal(); return; }
  if(Net.mode==="host"){
    const connId=PC(idx) && PC(idx).conn;
    if(connId) Net.transport.to(connId, {t:"traitorAwake"});
  }
},
traitorAwakeModal(){

    <p>${DUNGEONS[S.dun].name}'s master is dead, and whatever was holding you in shape died with it.
       You can turn on them now, or walk out beside them as though nothing happened.</p>
    <p>There is no clock on this. Keep playing as ${escHtml(ME().name)} for as long as you like —
       one turn, the whole climb out, or forever. <b>Turn on them</b> sits on your screen until you
       press it, and nobody else can see that it is there.</p>
    <div class="navrow"><button class="ch go" onclick="closeModal()"><b>Understood</b></button></div>`);
},

promptTraitorName(){

traitorNameModal(){

    <p>You are the traitor. Nothing about you looks different yet — help this party, or don't.
       Once ${DUNGEONS[S.dun].name}'s true master falls, turning on them becomes yours to do,

    <div class="namerow"><input id="tname" maxlength="20" placeholder="a name for what you'll become"></div>

// The instant the real boss dies, if a traitor is still walking among the
// party, they stop being an ally and become the true fight. The engine
// drives its attacks automatically every round exactly like any other
// monster (Rules.monsterTurn, unchanged) — the only thing layered on top
// is a bonus "Dark Strike" the traitor's own screen can press whenever it
// likes, off the normal turn cycle (see the "darkstrike" case in perform).
revealTraitor(){
  const idx=S.traitor.idx, pc=PC(idx);
  if(!pc) return;
  S.traitor.revealed=true;
  pc.isBoss=true;
  const base=MONSTERS[DUNGEONS[S.dun].boss];
  const n=Math.max(1, S.party.filter(p=>!p.isBoss).length);
  let hp=Math.max(1,R.parse(base.hp));
  hp=Math.round(hp*1.6*(1+0.5*(n-1)));
  const name=S.traitor.secretName || "The Unmasked";
  S.fight={ name, the:name, hp, hpMax:hp, ac:base.ac+2, atk:base.atk+2, dmg:base.dmg,
            xp:Math.round(base.xp*1.5), atks:n>=3?3:2, rattled:0, boss:true, fl:"was one of you, until it wasn't" };
  S.round=1; S.acted=[]; S.active=conscious()[0]??0;
  out(`<span class="hurt">It was ${escHtml(pc.name)}, all along.</span> `+
      `<span class="hurt">They are not ${escHtml(pc.name)} any more — <b>${escHtml(name)}</b> has come to collect what's owed.</span>`);
},

/* ---- choices ---- */
choices(){
  const box=document.getElementById("choices"); box.innerHTML=""; box.className="";
  if(!S) return;
  const me=ME(), r=S.map[S.at];
  const myTurn = !S.fight || S.active===S.me;
  const add=(label,fn,danger)=>{
    const b=document.createElement("button");
    b.className="ch"+(danger?" danger":""); b.innerHTML=label; b.onclick=fn; box.appendChild(b);
  };

  // The revealed traitor isn't part of the turn order any more (conscious()
  // excludes them) — they get their own screen entirely, off-cycle, for as
  // long as the boss fight they now are lasts.
  if(S.traitor && S.traitor.revealed && S.traitor.idx===S.me){
    const tb2=document.getElementById("turn");
    if(S.fight){
      tb2.innerHTML=`<b>You are ${escHtml(S.traitor.secretName||"the thing that rises")}.</b> Strike whenever you like.`;
      add(`<b>Dark Strike</b> <span style="color:var(--dim)">(${S.traitor.strikesLeft||0} left)</span>`,
        ()=>G.act("darkstrike"), true);
      if((S.traitor.strikesLeft||0)<=0)
        add(`<span style="color:var(--dim)">Nothing left to strike with — the rest is out of your hands now.</span>`, ()=>{});
    } else {
      tb2.innerHTML="";
      add(`<span style="color:var(--dim)">It's over. Whatever you were, you aren't any more.</span>`, ()=>{});
    }
    document.getElementById("txt").disabled=true;
    document.getElementById("go").disabled=true;
    return;
  }

  // turn banner
  const tb=document.getElementById("turn");
  if(S.flags.dead||S.flags.won) tb.innerHTML="";
  else if(S.party.length>1)
    tb.innerHTML = S.fight
      ? (myTurn ? `<b>Your turn.</b> Round ${S.round}.`
                : `Waiting on <b>${PC(S.active).name}</b> — round ${S.round}.`)
      : `Between fights — anyone may act.`;
  else tb.innerHTML="";

  const inputOn = myTurn && !me.down;
  document.getElementById("txt").disabled=!inputOn;
  document.getElementById("go").disabled=!inputOn;

  if(me.down){
    add(`<span style="color:var(--dim)">You are down — wait for a hand up</span>`, ()=>{});
    return;
  }
  if(!myTurn) return;

  if(S.fight){
    add(`<b>Attack</b> the ${S.fight.name.toLowerCase()}`, ()=>G.attempt("attack"), true);
    if(me.power.uses>0 && !(me.power.name==="Second Wind" && me.hp>=me.hpMax))
      add(`<b>${me.power.name}</b> <span style="color:var(--dim)">(${me.power.uses})</span>`, ()=>G.attempt("power"));
    if(me.potions>0)    add(`<b>Drink</b> a potion <span style="color:var(--dim)">(${me.potions})</span>`, ()=>G.act("potion"));
    // One button per distinct item with a real combat effect currently
    // carried — counts collapse duplicates (two oil flasks shows one
    // button with a ×2), same idea as the potion count above.
    [...new Set(me.inv.filter(i=>ITEM_EFFECTS[i]))].forEach(item=>{
      const n=me.inv.filter(i=>i===item).length;
      const verb=ITEM_EFFECTS[item].kind==="throw" ? "Throw" : "Scatter";
      add(`<b>${verb}</b> ${item.toLowerCase()} <span style="color:var(--dim)">(${n})</span>`,
        ()=>G.act("useItem", null, item));
    });
    const down=S.party.map((p,i)=>({p,i})).filter(x=>x.p.down);
    if(down.length && me.potions>0) add(`<b>Help</b> ${down[0].p.name} up`, ()=>G.act("revive",null,down[0].i));
    add(`<b>Hide</b>`, ()=>G.attempt("hide"));
    add(`<b>Talk</b> to it`, ()=>G.attempt("talk"));
    add(`<b>Flee</b>`, ()=>G.attempt("flee"), true);
  } else {
    const NAV=DUNGEONS[S.dun].nav||{};
    if(S.at===S.map.length-1 && !S.flags.crown) add(`<b>Take</b> ${DUNGEONS[S.dun].goal}`, ()=>G.act("take"), true);
    else if(S.flags.crown) add(S.at<=0 ? (NAV.out||`<b>Climb</b> out into daylight`)
                                       : (NAV.up ||`<b>Climb</b> toward the surface`), ()=>G.act("move"));
    else add(NAV.down||`<b>Go</b> deeper`, ()=>G.act("move"));
    if(!r.searched) add(`<b>Search</b> the ${PLACE()}`, ()=>G.attempt("search"));
    add(`<b>Look</b> around`, ()=>G.act("look"));
    if(S.party.some(p=>p.hp<p.hpMax)) add(`<b>Rest</b> <span style="color:var(--dim)">(risky)</span>`, ()=>G.act("rest"));
    if(me.potions>0 && me.hp<me.hpMax) add(`<b>Drink</b> a potion <span style="color:var(--dim)">(${me.potions})</span>`, ()=>G.act("potion"));
  }
  // Only the traitor's own screen ever renders these — the effects land as
  // ordinary bad luck or a lucky break in the shared log, never attributed.
  if(S.traitor && S.traitor.active && !S.traitor.revealed && S.traitor.idx===S.me){
    if(S.traitor.awakened)
      add(`<span style="color:var(--red)">Turn on them</span> <span style="color:var(--dim)">— whenever you like</span>`,
        ()=>G.act("traitorTurn"), true);
    if((S.traitor.sabotageLeft||0)>0)
      add(`<span style="color:var(--purple)">Sabotage, quietly</span> <span style="color:var(--dim)">(${S.traitor.sabotageLeft})</span>`,
        ()=>G.attempt("traitorSabotage"));
    if((S.traitor.aidLeft||0)>0)
      add(`<span style="color:var(--purple)">Aid, quietly</span> <span style="color:var(--dim)">(${S.traitor.aidLeft})</span>`,
        ()=>G.attempt("traitorAid"));
  }
  if(inputOn) focusTxt();
},

clarify(note, alts){
  const box=document.getElementById("choices"); box.innerHTML="";
  out(`<span class="sys">${note}</span>`);
  for(const [label, action] of alts){
    const b=document.createElement("button"); b.className="ch";
    b.innerHTML = action==="freeform"
      ? `<span style="color:var(--purple)">${label}</span>` : `<b>${label}</b>`;
    b.onclick=()=>{
      if(String(action).startsWith("revive:")) G.act("revive", null, +String(action).split(":")[1]);
      else G.attempt(action, G.pending);
    };
    box.appendChild(b);
  }
  const c=document.createElement("button"); c.className="ch";
  c.innerHTML=`<span style="color:var(--dim)">Never mind</span>`;
  c.onclick=()=>{ out(`<span class="sys">You think better of it.</span>`); G.choices(); };
  box.appendChild(c);
  focusTxt();
},

/* ---- endings ---- */
death(){
  document.getElementById("choices").innerHTML="";
  document.getElementById("turn").innerHTML="";
  SFX.down();
  scene(`${DUNGEONS[S.dun].short.replace(/^the /,"The ")} keeps you`);
  out(`${S.party.length>1?"They go down":"You go down"} onto the cold stones, and the cold stones are
       patient, and after a while ${S.party.length>1?"they are":"you are"} simply another thing that is here.
       <span class="sys">${S.party.map(p=>`${p.name}, level ${p.lvl}`).join(" · ")} — reached ${S.map[S.at].n}.</span>`);
  if(Net.mode!=="guest"){
    const b=document.getElementById("choices");
    const btn=document.createElement("button"); btn.className="ch";
    btn.innerHTML="<b>Try again</b>"; btn.onclick=()=>G.start(); b.appendChild(btn);
  }
  sync();
},
victory(){
  document.getElementById("choices").innerHTML="";
  document.getElementById("turn").innerHTML="";
  SFX.victory();
  scene("Daylight");
  const survivors=S.party.filter(p=>!p.isBoss);
  out(`You come up out of ${DUNGEONS[S.dun].short} with ${DUNGEONS[S.dun].prize.toLowerCase()}, and the light
       is so ordinary it is almost insulting. Behind you, something settles, and stops.
       <span class="sys">${survivors.map(p=>`${p.name} the ${p.cls.toLowerCase()}, level ${p.lvl}, ${p.hp}/${p.hpMax}`).join(" · ")}</span>`);
  if(S.traitor && S.traitor.revealed){
    const traitorPc=S.party.find(p=>p.isBoss);
    if(traitorPc) out(`<span class="sys">${traitorPc.name} does not come up with you. Nobody who was at that
      table will ever quite agree on what ${escHtml(S.traitor.secretName||"it")} looked like.</span>`);
  }
  if(Net.mode!=="guest"){
    const b=document.getElementById("choices");
    const btn=document.createElement("button"); btn.className="ch";
    btn.innerHTML="<b>Descend again</b>"; btn.onclick=()=>G.start(); b.appendChild(btn);
  }
  sync();
},

help(){
  modal(`<h3>How to play</h3>
    <p>Press a button, or type. Typing recognises these as commands:</p>
    <p style="color:var(--gold);font-size:13px">go · look · search · attack · cast · drink · rest ·
       flee · hide · talk · pray · revive · wait · listen · inventory · use &lt;thing&gt;</p>
    <p><b>Ask questions.</b> Anything ending in "?" — or starting with what / where / can / do I —
       is answered from your actual character sheet. Costs no turn, rolls nothing.
       Try <em>do I have magic abilities?</em> or <em>who is in the party?</em></p>
    <p><b>The game will not guess at you.</b> Only the first real verb counts, negation is respected,
       and unclear input is queried rather than mapped onto the nearest button. Every typed line shows
       what was understood, greyed out beside it.</p>
    <p>Anything the rules don't model goes to the <b>oracle</b> — a d6 ladder from <em>No, and</em>
       to <em>Yes, and</em> plus an ability check matched to what you're attempting. It has real
       consequences in both directions.</p>

    <h3 style="margin-top:22px">Playing with friends</h3>
    <p>Press <b>Play with friends</b>. One person hosts and reads out the four-letter code; up to
       three others join with it. Connections are peer-to-peer — there is no server and nothing to pay for.</p>
    <p><b>Your name and badge</b> can be changed any time — press the ✎ beside your name, or
       open your character sheet. In a party, everyone sees the change immediately.</p>
    <p><b>Table Talk</b> appears in the sidebar once you host or join — a chat line the whole
       party sees, for planning without spending turns. Reloading the page does not create a
       second character; you come back as yourself.</p>
    <p>In a fight, turns go round the party. Between fights anyone may act. A character at 0 hit points
       is down, not dead — spend a potion to get them up, or they rise at 1 hit point when the fighting
       stops. Everyone dies only if everyone is down.</p>
    <p><b>Traitor Mode</b> (host only, needs two or more in the party) — open <b>Play with friends</b>
       while hosting to switch it on. One of you is secretly chosen as the traitor and gets a couple of
       quiet extra options on your own turns, nobody else ever sees them. Nobody else is told that the mode
       is on at all — arming it is silent, and the state a guest's browser receives says it was never
       switched on.</p>
    <p>When the true final boss falls, the traitor is told privately that the way is open. Turning is
       theirs to time: they can keep playing as themselves for one more turn, the whole climb out, or
       for good. When they do turn, they become what the dungeon was really protecting — under a name
       only they chose, boosted, and fought like any other monster (with one bonus move that's theirs
       alone).</p>
    <p style="font-size:13px;color:var(--dim)">The host runs the rules. Guests send what they want to do
       and receive the result — they never roll, so a modified guest cannot cheat.</p>

    <h3 style="margin-top:22px">Sound (optional)</h3>
    <p>Hits, misses, heals, level-ups and the dice ceremony all have a short synthesized cue —
       nothing to download, works fully offline. <b>Sound</b> in the top bar mutes it, and it
       remembers your choice. It fires the same way for everyone in a party, since it reads off
       what the narrator actually says.</p>
    <p><b>Music</b> opens a small floating YouTube player for table music — paste a link (a
       D&D ambient track, a lofi loop, anything). The host picks the track and everyone at the
       table gets their own player for it, with their own play/pause and volume, so there is no
       playback position to keep in sync. It remembers your track between sessions. Collapse it
       with <b>–</b> or stop it with <b>✕</b>.</p>

    <h3 style="margin-top:22px">AI narration (optional)</h3>
    <p>The game is complete without either of these. Both only rewrite the prose — every roll and
       outcome is decided by the rules first, and in multiplayer only the host needs one connected;
       everyone else just sees the same reworded text.</p>
    <p><b>Connect local AI</b> talks to a model on your own machine. Install
       <a href="https://ollama.com" style="color:var(--gold)">Ollama</a>, then run:</p>
    <p><code>ollama pull llama3.2</code><br><code>OLLAMA_ORIGINS='*' ollama serve</code></p>
    <p><b>Connect cloud AI</b> is the no-install option — it uses this deployment's own
       narration function instead, and only works once the game is running on its real hosted
       address rather than opened as a local file.</p>
    <p style="font-size:12px;color:var(--dim);margin-top:18px">Uses content from the SRD 5.2.1,
       © Wizards of the Coast, licensed under CC-BY-4.0.</p>
    <button class="ch" onclick="closeModal()">Close</button>`);
},

async host(){
  modal(`<h3>Opening a room…</h3><p class="sys">Loading the peer-to-peer library.</p>`);
  try{
    await loadPeer();
    const code=Array.from({length:4},()=>"ABCDEFGHJKLMNPQRSTUVWXYZ"[R.int(24)]).join("");
    Net.peer=new Peer("barrow-"+code, {debug:0, config:{iceServers:PEER_ICE}});
    Net.peer.on("open", ()=>{
      Net.mode="host"; Net.code=code;
      Chat.show();
      document.getElementById("room").innerHTML=`hosting <span id="code">${code}</span>`;
      document.getElementById("mpbtn").className="tb hot";
      document.getElementById("mpbtn").textContent="Party: 1";
      modal(`<h3>Room open</h3>
        <p>Read this out to your friends:</p>
        <p style="text-align:center"><span id="code" style="font-size:30px">${code}</span></p>
        <p>They press <b>Play with friends → Join with a code</b> and type it in. Up to three others.</p>
        <button class="ch" onclick="closeModal()">Start playing</button>`);
    });
    Net.peer.on("connection", (c)=>{
      Net.conns.push(c);
      c.on("data", (m)=>Net.hostReceive(m, c.peer));
      c.on("close", ()=>{
        const i=S.party.findIndex(p=>p.conn===c.peer);
        if(i>0){ out(`<span class="sys">${PC(i).name} has gone quiet. They are on their own now.</span>`);
                 PC(i).offline=true; }
        Net.conns=Net.conns.filter(x=>x!==c);
        document.getElementById("mpbtn").textContent="Party: "+(Net.conns.length+1);
        sync(); G.choices();
      });
      c.on("open", ()=>{ document.getElementById("mpbtn").textContent="Party: "+(Net.conns.length+1); });
    });
    Net.peer.on("error", (e)=>G.netFail(e));
  }catch(e){ G.netFail(e); }
},

async join(){
  if(G._joining) return;                    // double-click guard
  G._joining=true; setTimeout(()=>G._joining=false, 4000);
  const code=(document.getElementById("joincode").value||"").trim().toUpperCase();
  if(code.length!==4){ document.getElementById("joincode").style.borderColor="var(--red)"; G._joining=false; return; }
  modal(`<h3>Joining ${code}…</h3><p class="sys">Loading the peer-to-peer library.</p>`);
  try{
    await loadPeer();
    Net.peer=new Peer({debug:0, config:{iceServers:PEER_ICE}});
    Net.peer.on("open", ()=>{
      const c=Net.peer.connect("barrow-"+code, {reliable:true});
      Net.hostConn=c;
      c.on("open", ()=>{
        Net.mode="guest"; Net.code=code;
        Chat.show();
        document.getElementById("room").innerHTML=`in <span id="code">${code}</span>`;
        document.getElementById("mpbtn").className="tb hot";
        document.getElementById("mpbtn").textContent="Joined";
        document.getElementById("log").innerHTML="";
        closeModal();
        const me=ME();
        c.send({t:"join", name:me.name, cls:me.cls, anc:me.anc, bg:me.bg,
                av:me.av, pid:Net.pid()});
      });
      c.on("data", (m)=>Net.guestReceive(m));
      c.on("close", ()=>{
        out(`<span class="hurt">The host has gone. The session ends here.</span>`);
        document.getElementById("choices").innerHTML="";
      });
      setTimeout(()=>{ if(Net.mode!=="guest") G.netFail(new Error("no answer")); }, 12000);
    });
    Net.peer.on("error", (e)=>G.netFail(e));
  }catch(e){ G.netFail(e); }
},

netFail(e){
  Net.mode="solo";
  const type=e&&e.type;
  // "browser-incompatible" is PeerJS's own feature-detection failing before
  // any connection attempt even starts — it means WebRTC itself isn't
  // available to the page, which is a completely different problem from
  // every other error type (those are real network/signaling failures
  // after WebRTC checked out fine). The generic network/firewall advice
  // below is actively misleading for this one, so it gets its own message.
  if(type==="browser-incompatible"){
    const hasRTC = typeof RTCPeerConnection!=="undefined";
    modal(`<h3>This browser can't do peer-to-peer</h3>
      <p>That's not a network or firewall problem — PeerJS checked and this browser (or
         something inside it) doesn't expose WebRTC at all, so it never even tried to connect.</p>
      <p>Most common causes: a privacy/ad-blocking extension that deliberately hides or disables
         WebRTC to prevent IP leaks (uBlock Origin's "Prevent WebRTC leaks", "WebRTC Leak Prevent",
         and similar all do this on purpose); an in-app browser embedded inside another app
         (opening the link from inside Instagram, LinkedIn, Discord, etc. instead of a real
         browser); or a browser with WebRTC turned off in its own privacy settings.</p>
      <p>Worth trying: open this page in a normal browser tab (not an in-app one) — Chrome,
         Firefox, Edge, or Safari all support this fine by default — and if that doesn't help,
         briefly disable extensions one at a time to find the one blocking it.</p>
      <p style="font-size:12px;color:var(--dim)">Technical detail, if it helps track this down:
         RTCPeerConnection is ${hasRTC?"present but PeerJS still couldn't use it":"not available on this page at all"},
         on <code>${escHtml(navigator.userAgent)}</code>.</p>
      <p style="font-size:13px;color:var(--dim)">Your solo game is untouched. Close this and keep playing.</p>
      <button class="ch" onclick="closeModal(); G.choices()">Close</button>`);
    return;
  }
  modal(`<h3>Could not connect</h3>
    <p>${String(type||e&&e.message||e||"unknown")}.</p>
    <p>Peer-to-peer needs the internet and an open path between the two machines. Some
       networks — office and school ones especially — block it. Common causes: the code was
       mistyped, the host has not opened the room yet, or one of you is behind a strict firewall.</p>
    <p style="font-size:13px;color:var(--dim)">Your solo game is untouched. Close this and keep playing.</p>
    <button class="ch" onclick="closeModal(); G.choices()">Close</button>`);
},

/* ---- optional AI ---- */
async tryOllama(loud){
  try{
    const res=await fetch("http://localhost:11434/api/tags",{signal:AbortSignal.timeout(2500)});
    const j=await res.json();
    if(!j.models || !j.models.length) throw new Error("no models");
    const pref=j.models.find(m=>/llama3|qwen|mistral|gemma|phi/i.test(m.name)) || j.models[0];
    Narrator.ollama=true; Narrator.backend="local"; Narrator.model=pref.name;
    dot("on"); aitxt("Narrator: "+pref.name.split(":")[0]); updateAiButtons();
    if(loud) out(`<span class="sys">Local narrator connected — ${pref.name}. Rules are still decided by the game.</span>`);
  }catch(e){
    Narrator.ollama=false; Narrator.backend=null; dot(""); aitxt("Narrator: built-in"); updateAiButtons();
    if(loud) modal(`<h3>No local model found</h3>
      <p>The game runs fine without one — this only changes how the prose reads.</p>
      <p>Install <a href="https://ollama.com" style="color:var(--gold)">Ollama</a> and run:</p>
      <p><code>ollama pull llama3.2</code><br><code>OLLAMA_ORIGINS='*' ollama serve</code></p>
      <p style="font-size:13px;color:var(--dim)">The <code>OLLAMA_ORIGINS</code> part matters — without it
      the browser blocks this page from reaching Ollama.</p>
      <button class="ch" onclick="closeModal()">Close</button>`);
  }
},

// Same idea as tryOllama, but for anyone who doesn't want to run a model
// locally: this pings the game's own /api/narrate function, which (when
// deployed with a Groq key configured) rewords prose via Groq's free tier
// instead of a local Ollama instance. Only works once the game is running
// on its real hosted address — a same-origin function doesn't exist for a
// page opened as a local file.
async tryCloud(loud){
  try{
    const res=await fetch("/api/narrate",{
      method:"POST", headers:{"Content-Type":"application/json", "x-barrow-key":"barrow-of-vethkar"},
      body:JSON.stringify({text:"A quiet chamber, nothing more.", context:"a connection check"}),
      signal:AbortSignal.timeout(9000)
    });
    if(!res.ok){
      const j=await res.json().catch(()=>({}));
      throw new Error(j.error||("bad status "+res.status));
    }
    Narrator.ollama=true; Narrator.backend="cloud"; Narrator.model="groq";
    dot("on"); aitxt("Narrator: cloud (groq)"); updateAiButtons();
    if(loud) out(`<span class="sys">Cloud narrator connected. Rules are still decided by the game.</span>`);
  }catch(e){
    Narrator.ollama=false; Narrator.backend=null; dot(""); aitxt("Narrator: built-in"); updateAiButtons();
    if(loud) modal(`<h3>Cloud narrator unavailable</h3>
      <p>The game runs fine without one — this only changes how the prose reads.</p>
      <p>This needs two things: the game running on its real hosted address (not opened as a local
         file), and a Groq API key set as this deployment's <code>GROQ_API_KEY</code> environment
         variable. If you just set that up, redeploy and try again.</p>
      <button class="ch" onclick="closeModal()">Close</button>`);
  }
},

/* ---- persistence ---- */
save(){
  const blob=new Blob([JSON.stringify(S)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=`${ME().name.toLowerCase()}-barrow-save.json`; a.click();
  try{ localStorage.setItem("barrow", JSON.stringify(S)); }catch(e){}
  out(`<span class="sys">Saved.</span>`);
},
load(input){
  const f=input.files[0]; if(!f) return;
  const fr=new FileReader();
  fr.onload=()=>{
    try{
      const d=JSON.parse(fr.result);
      if(!d.party || !d.party[0] || !d.party[0].anc) throw new Error("old save");
      S=ensureTraitorField(d); S.me=Math.min(S.me||0, S.party.length-1);
      closeModal();
      document.getElementById("log").innerHTML="";
      out(`<span class="sys">Save restored — ${S.party.map(p=>`${p.name} (${p.lvl})`).join(", ")}.</span>`);
      G.describeRoom(false); sync();
    }catch(e){ out(`<span class="hurt">That file could not be read${/old save/.test(e.message)?" — it is from an older version":""}.</span>`); }
  };
  fr.readAsText(f); input.value="";
}
};

/* ------------------------------------------------------------ helpers --- */
// PeerJS's own default config bundles very few STUN servers, which is a
// real cause of "cannot start"/"cannot connect" failures on some networks —
// WebRTC needs at least one working STUN server on both sides to discover
// a public address, and having only one gives no fallback if it's briefly
// unreachable. This is just a longer, well-known public STUN list (no TURN
// relay, still free) — it can't fix a strict symmetric-NAT/corporate
// firewall that blocks WebRTC outright (nothing short of a paid TURN relay
// can), but it meaningfully improves the odds on an ordinary home network.
const PEER_ICE=[
  {urls:"stun:stun.l.google.com:19302"},
  {urls:"stun:stun1.l.google.com:19302"},
  {urls:"stun:stun2.l.google.com:19302"},
  {urls:"stun:stun.cloudflare.com:3478"}
];
function loadPeer(){
  return new Promise((res,rej)=>{
    if(window.Peer) return res();
    const s=document.createElement("script");
    s.src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js";
    s.onload=()=>res(); s.onerror=()=>rej(new Error("could not load the peer library"));
    document.head.appendChild(s);
  });
}
const escHtml=(s)=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const escAttr=escHtml;
// One place decides what a legal name is, so host and client can never disagree.
function cleanName(s){
  return String(s==null?"":s).replace(/[<>&"]/g,"").replace(/\s+/g," ").trim().slice(0,16);
}
function uniqueName(name, exceptIdx){
  let n=name, i=2;
  const taken=()=>S.party.some((p,ix)=>ix!==exceptIdx && p.name.toLowerCase()===n.toLowerCase());
  while(taken() && i<40){ n=name.slice(0,14)+" "+i; i++; }
  return n;
}
function bumpText(bump, cls){
  const prime=CLASSES[cls]?CLASSES[cls].prime:"str";
  return Object.entries(bump).map(([k,v])=>
    `+${v} ${(k==="prime"?prime:k).toUpperCase()}`).join(", ");
}
function dot(cls){ document.getElementById("dot").className=cls; }
function aitxt(t){ document.getElementById("aitxt").textContent=t; }
// The two "Connect ... AI" toolbar buttons double as status: whichever
// backend is actually active reads "connected" and picks up the same gold
// "hot" styling the dice/sound toggles use, so it's not just the small dot
// up top that says something's on. Called from both connect paths (success
// and failure) and from the mid-game reset when a call fails partway
// through, so the buttons never go stale relative to Narrator's real state.
function updateAiButtons(){
  const lb=document.getElementById("localaibtn"), cb=document.getElementById("cloudaibtn");
  if(!lb || !cb) return;
  const activeLocal = Narrator.ollama && Narrator.backend==="local";
  const activeCloud = Narrator.ollama && Narrator.backend==="cloud";
  lb.textContent = activeLocal ? "Local AI connected" : "Connect local AI";
  lb.classList.toggle("hot", activeLocal);
  cb.textContent = activeCloud ? "Cloud AI connected" : "Connect cloud AI";
  cb.classList.toggle("hot", activeCloud);
}
// `sticky` marks a modal that must not be dismissed by clicking the backdrop.
// The character creator and the resume-or-restart prompt are both shown while
// S is still null — closing either one used to leave a live page with no
// character, no buttons and no way back except a manual reload.
let MODAL_STICKY=false;
function modal(html, sticky){
  MODAL_STICKY=!!sticky;
  document.getElementById("mbox").innerHTML=html;
  document.getElementById("modal").classList.add("show");
}
function closeModal(){ MODAL_STICKY=false; document.getElementById("modal").classList.remove("show"); }

function sync(){
  if(!S || !S.party) return;
  const me=ME();

  const multi=S.party.length>1;
  document.getElementById("partybox").style.display = multi ? "" : "none";
  const mp=document.getElementById("mobparty");
  mp.classList.toggle("on", multi);
  if(multi){
    mp.innerHTML=S.party.map((p,i)=>{
      const cls=["mp", i===S.me?"me":"", (S.fight&&S.active===i)?"act":"", p.down?"down":""].join(" ");
      return `<div class="${cls}">${avatarSVG(p,18)}<b>${escHtml(p.name)}${i===S.me?" ·you":""}</b>
        <div class="hb"><i style="width:${Math.max(0,100*p.hp/p.hpMax)}%"></i></div></div>`;
    }).join("");
  }
  if(multi){
    document.getElementById("party").innerHTML=S.party.map((p,i)=>{
      const cls=["pc", i===S.me?"me":"", (S.fight&&S.active===i)?"act":"", p.down?"down":""].join(" ");
      return `<div class="${cls}">
        <div class="nm">${avatarSVG(p,26)}<b>${escHtml(p.name)}${i===S.me?" (you)":""}</b><s>${p.down?"down":p.cls}</s></div>
        <div class="hb"><i style="width:${Math.max(0,100*p.hp/p.hpMax)}%"></i></div>
      </div>`;
    }).join("");
  }

  document.getElementById("pcname").innerHTML=
    `${avatarSVG(me,30)}<span>${escHtml(me.name)}</span>
     <button class="tb pen" onclick="G.identity()" title="Rename or re-badge">✎</button>`;
  document.getElementById("pcclass").textContent =
    `level ${me.lvl} ${(me.anc||"").toLowerCase()} ${me.cls.toLowerCase()}${me.bg?" · "+me.bg.toLowerCase():""}`;
  document.getElementById("hp").textContent=`${me.hp} / ${me.hpMax}`;
  document.getElementById("hpbar").style.width=Math.max(0,100*me.hp/me.hpMax)+"%";
  document.getElementById("ac").textContent=me.ac;
  document.getElementById("lvl").textContent=me.lvl;
  document.getElementById("xp").textContent=me.xp;
  document.getElementById("abils").innerHTML=["str","dex","con","int","wis","cha"].map(k=>{
    const v=me.ab[k];
    return `<div class="ab"><s>${k.toUpperCase()}</s><b>${v}</b><u>${mod(v)>=0?"+":""}${mod(v)}</u></div>`;
  }).join("");
  document.getElementById("inv").innerHTML=me.inv.map(i=>`<div class="item">${i}</div>`).join("")
    + (me.potions>0?`<div class="item">Potions of Healing <em>×${me.potions}</em></div>`:"");
  document.getElementById("quest").innerHTML=S.journal.map(q=>`<div class="item">${q}</div>`).join("")
    + `<div class="item"><em>Depth ${S.at+1} of ${S.map.length}</em></div>`
    + (S.flags.crown?`<div class="item" style="color:var(--gold)">${DUNGEONS[S.dun].prize} is carried.</div>`:"");

  autosave();
}

// Silent continuous save so a reload (or a closed tab) never costs the run —
// the "Save" button still exists for an explicit downloadable copy, but
// progress no longer depends on remembering to press it.
function autosave(){
  if(!S || !S.party) return;
  try{ localStorage.setItem("barrow", JSON.stringify(S)); }catch(e){}
}

/* ------------------------------------------------------------- wiring --- */
// Auto-focusing the text field pops the keyboard on every turn on a phone.
// Only do it where a hardware keyboard is the norm.
const WANT_FOCUS = window.matchMedia && window.matchMedia("(hover:hover) and (pointer:fine)").matches;
function focusTxt(){ if(WANT_FOCUS) document.getElementById("txt").focus(); }

function submit(){
  const t=document.getElementById("txt");
  const v=t.value.trim(); if(!v||!S) return;
  if(S.flags.dead||S.flags.won) return;
  t.value="";
  const p=parse(v); if(!p) return;
  G.pending=p.raw; G.pendingItem=p.item||null;

  const tag = p.action==="ask"      ? `<span style="color:var(--dim)"> · unclear</span>`
            : p.action==="query"    ? `<span style="color:var(--dim)"> · asking</span>`
            : p.action==="noSuch"   ? `<span style="color:var(--dim)"> · you have no such thing</span>`
            : p.action==="freeform" ? `<span style="color:var(--purple)"> · the barrow decides${p.item?` (${p.item.toLowerCase()})`:""}</span>`
            : `<span style="color:var(--dim)"> · ${actionLabel(p.action)}</span>`;
  out(`<span class="you">${S.party.length>1?escHtml(ME().name)+": ":""}${escHtml(v)}</span>${tag}`);

  if(p.action==="ask"){ G.clarify(p.note, p.alts); return; }
  G.attempt(p.action, p.raw, p.target);
}
document.getElementById("go").onclick=submit;
document.getElementById("chatgo").onclick=()=>Chat.send();
document.getElementById("chattxt").addEventListener("keydown",e=>{
  if(e.key==="Enter") Chat.send();
  e.stopPropagation();
});
document.getElementById("txt").addEventListener("keydown",e=>{ if(e.key==="Enter") submit(); });
document.getElementById("modal").addEventListener("click",e=>{ if(e.target.id==="modal" && !MODAL_STICKY) closeModal(); });

G.start();
</script>
</body>
</html>
