<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Barrow of Vethkar</title>
<style>
:root{
  --bg:#14100c; --panel:#1e1812; --line:#3a3026;
  --ink:#e8dcc4; --dim:#9a8f7c; --gold:#c9a227; --red:#c2564a;
  --green:#7fa96a; --blue:#7a94c0; --purple:#a07cc0;
}
*{box-sizing:border-box}
html,body{height:100%}
@supports(height:100dvh){ body{height:100dvh} }
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:16px/1.6 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  display:flex; flex-direction:column;
}
button{font-family:inherit}
.wrap{flex:1; display:flex; min-height:0; max-width:1220px; width:100%; margin:0 auto}


/* ---- sidebar ---- */
#side{width:300px; flex:none; background:var(--panel); border-right:1px solid var(--line);
  padding:16px; overflow-y:auto}

#side h1{font-size:15px; letter-spacing:.14em; text-transform:uppercase; color:var(--gold); margin:0 0 4px}
.sub{font-size:12px; color:var(--dim); margin-bottom:14px; font-style:italic}
.stat{display:flex; justify-content:space-between; font-size:14px; padding:3px 0; border-bottom:1px dotted #2e2720}
.stat b{font-weight:600; color:var(--dim); font-variant:small-caps; letter-spacing:.05em}
.bar{height:7px; background:#2b241c; border-radius:4px; overflow:hidden; margin:6px 0 12px}
.bar i{display:block; height:100%; background:linear-gradient(90deg,#8c3a30,#c2564a); transition:width .35s}
.abils{display:grid; grid-template-columns:repeat(3,1fr); gap:5px; margin:10px 0 14px}
.ab{background:#241d16; border:1px solid var(--line); border-radius:5px; text-align:center; padding:5px 2px}
.ab s{display:block; text-decoration:none; font-size:10px; color:var(--dim); letter-spacing:.08em}
.ab b{display:block; font-size:17px}
.ab u{display:block; text-decoration:none; font-size:11px; color:var(--gold)}
.sect{font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--gold);
  margin:18px 0 7px; padding-bottom:4px; border-bottom:1px solid var(--line)}
.item{font-size:13px; padding:2px 0; color:#cfc2a8}
.item em{color:var(--dim); font-style:normal; font-size:11px}

/* ---- party ---- */
.pc{border:1px solid var(--line); border-radius:6px; padding:7px 9px; margin-bottom:6px; background:#241d16}
.pc.me{border-color:#5c4a24}
.pc.act{border-color:var(--gold); box-shadow:0 0 0 1px #c9a22733}
.pc.down{opacity:.5}
.pc .nm{display:flex; justify-content:space-between; font-size:13px; align-items:baseline}
.pc .nm b{color:var(--ink); font-weight:600}
.pc .nm s{text-decoration:none; font-size:10px; color:var(--dim); letter-spacing:.06em; text-transform:uppercase}
.pc .hb{height:5px; background:#2b241c; border-radius:3px; overflow:hidden; margin-top:5px}
.pc .hb i{display:block; height:100%; background:linear-gradient(90deg,#8c3a30,#c2564a)}
.pc.down .hb i{background:#5a5147}

/* ---- main ---- */
#main{flex:1; display:flex; flex-direction:column; min-width:0; min-height:0}
#log{flex:1; overflow-y:auto; padding:24px 28px; min-height:0}
@media(max-width:820px){ #log{padding:18px} }
#log p{margin:0 0 14px; max-width:66ch}
.you{color:var(--gold); font-style:italic}
.you::before{content:"› "}
.sys{color:var(--dim); font-size:13px; font-style:italic}
.hit{color:var(--green)} .miss{color:var(--dim)} .hurt{color:var(--red)}
.orc{color:var(--purple); font-size:14px}
.who{color:var(--blue); font-weight:600}
.roll{font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12px; color:var(--dim);
  background:#241d16; border:1px solid var(--line); border-radius:4px; padding:1px 6px}
h2.scene{font-size:19px; color:var(--gold); margin:22px 0 10px; letter-spacing:.03em;
  font-variant:small-caps; border-bottom:1px solid var(--line); padding-bottom:6px; max-width:66ch}

/* ---- controls ---- */
#ctl{flex:none; border-top:1px solid var(--line); background:var(--panel); padding:12px 28px 18px}
@media(max-width:820px){ #ctl{padding:12px 16px 16px} }
#turn{font-size:12px; color:var(--dim); margin-bottom:9px; font-style:italic; min-height:18px}
#turn b{color:var(--gold); font-style:normal}
#choices{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px}
.ch{background:#2a2219; color:var(--ink); border:1px solid #4a3d2c; border-radius:6px;
  padding:9px 15px; font-size:14px; cursor:pointer; transition:.15s; text-align:left}
.ch:hover{background:#3a2f21; border-color:var(--gold); color:#fff}
.ch:active{transform:translateY(1px)}
.ch b{color:var(--gold); font-weight:600}
.ch.danger{border-color:#5c3029} .ch.danger:hover{border-color:var(--red)}
#inrow{display:flex; gap:8px}
#txt{flex:1; background:#120e0a; border:1px solid var(--line); border-radius:6px;
  color:var(--ink); padding:10px 13px; font-size:16px; font-family:inherit; min-width:0}
#txt:focus{outline:none; border-color:var(--gold)}
#txt::placeholder{color:#645b4e; font-style:italic}
#txt:disabled{opacity:.45}
#go{background:var(--gold); color:#1a1409; border:none; border-radius:6px; padding:0 20px;
  font-weight:700; cursor:pointer; font-size:14px}
#go:hover{background:#e0b52e}
#go:disabled{background:#4a4033; color:#8a8070; cursor:default}

/* ---- roll gate ---- */
#choices.gate{display:block}
.rollgate{display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  background:#1c150e; border:1px solid #5c4a24; border-radius:8px; padding:12px 16px}
.rollprompt{font-size:13px; color:var(--dim); font-style:italic}
.rollprompt b{color:var(--gold); font-style:normal}
.die{background:#2a2219; border:2px solid var(--gold); color:var(--gold); border-radius:8px;
  width:52px; height:52px; font-size:26px; cursor:pointer; transition:.15s; flex:none}
.die:hover{background:#3a2f21; transform:scale(1.06)}
.die:active{transform:scale(.96)}
.die:disabled{cursor:default}
.die.spin{animation:diespin .06s linear infinite}
@keyframes diespin{0%{transform:rotate(0)}100%{transform:rotate(18deg)}}
.rollskip{background:none; border:none; color:var(--dim); text-decoration:underline;
  font-size:12px; cursor:pointer; font-family:inherit}
.rollskip:hover{color:var(--ink)}

/* ---- topbar ---- */
#top{flex:none; display:flex; align-items:center; gap:9px; padding:8px 16px; flex-wrap:wrap;
  background:#100c08; border-bottom:1px solid var(--line); font-size:12px; color:var(--dim)}
#top .sp{flex:1}
.tb{background:transparent; border:1px solid var(--line); color:var(--dim); border-radius:5px;
  padding:4px 11px; font-size:12px; cursor:pointer}
.tb:hover{color:var(--ink); border-color:var(--gold)}
.tb.hot{color:var(--gold); border-color:#5c4a24}
#ai,#room{display:inline-flex; align-items:center; gap:6px}
#dot{width:7px; height:7px; border-radius:50%; background:#5a5147}
#dot.on{background:var(--green); box-shadow:0 0 6px var(--green)}
#dot.busy{background:var(--gold); animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
#code{font-family:ui-monospace,Menlo,Consolas,monospace; color:var(--gold); letter-spacing:.22em;
  font-size:14px; font-weight:700}

/* ---- chat ---- */
#chatbox{margin-top:4px}
#chatlog{height:150px; overflow-y:auto; background:#120e0a; border:1px solid var(--line);
  border-radius:6px; padding:7px 9px; font-size:13px; margin-bottom:6px}
#chatlog p{margin:0 0 5px; line-height:1.4}
#chatlog b{color:var(--blue); font-weight:600}
#chatlog .cme b{color:var(--gold)}
#chatrow{display:flex; gap:6px}
#chattxt{flex:1; background:#120e0a; border:1px solid var(--line); border-radius:5px;
  color:var(--ink); padding:6px 9px; font-size:16px; font-family:inherit; min-width:0}
#chattxt:focus{outline:none; border-color:var(--gold)}
#chatgo{background:#2a2219; color:var(--gold); border:1px solid #4a3d2c; border-radius:5px;
  padding:0 12px; font-size:12px; cursor:pointer}
#chatgo:hover{border-color:var(--gold)}

/* ---- avatars & creator ---- */
.av{vertical-align:middle; flex:none}
#pcname{display:flex; align-items:center; gap:8px; text-transform:none; letter-spacing:.04em}
#pcname span{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.tb.pen{padding:2px 8px; font-size:13px; line-height:1.2}
.pc .nm{gap:7px; align-items:center}
.pc .nm b{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
#chatlog p{display:flex; align-items:flex-start; gap:6px; flex-wrap:wrap}
#mobparty .mp b{display:flex; align-items:center; gap:5px}

.stps{display:flex; gap:5px; margin:0 0 16px; flex-wrap:wrap}
.stp{background:transparent; border:1px solid var(--line); color:var(--dim); border-radius:5px;
  padding:5px 10px; font-size:12px; cursor:pointer; min-height:32px}
.stp.on{color:var(--gold); border-color:#5c4a24; background:#241d16}
.stp:hover{color:var(--ink)}
.ch.sel{border-color:var(--gold); background:#3a2f21}
.ch .dim, .dim{color:var(--dim); font-size:12px}
.navrow{display:flex; gap:8px; justify-content:space-between; align-items:center; margin-top:16px}
.navrow .ch.go{margin-left:auto}
.namerow{display:flex; gap:8px; margin:12px 0}
.namerow input{flex:1; background:#120e0a; border:1px solid var(--line); border-radius:6px;
  color:var(--ink); padding:10px 13px; font-size:16px; font-family:inherit; min-width:0}
.namerow input:focus{outline:none; border-color:var(--gold)}
.namerow .ch{flex:none; min-width:52px; text-align:center}
.avprev{display:flex; align-items:center; gap:14px; margin:14px 0; padding:12px;
  background:#241d16; border:1px solid var(--line); border-radius:8px}
.emgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(48px,1fr)); gap:6px; margin:12px 0}
.em{background:#241d16; border:1px solid var(--line); border-radius:7px; padding:5px;
  cursor:pointer; line-height:0; min-height:46px}
.em:hover{border-color:#6b5730}
.em.sel{border-color:var(--gold); background:#3a2f21}
.colrow{display:flex; gap:6px; flex-wrap:wrap; margin:10px 0 2px}
.col{width:32px; height:32px; border-radius:50%; border:2px solid transparent; cursor:pointer}
.col.sel{border-color:var(--ink); box-shadow:0 0 0 2px #000}

/* ---- mobile party strip ---- */
#mobparty{display:none; flex:none; gap:6px; padding:8px 12px 0; overflow-x:auto}
#mobparty .mp{flex:1; min-width:72px; background:#241d16; border:1px solid var(--line);
  border-radius:6px; padding:5px 8px; font-size:11px}
#mobparty .mp b{display:block; color:var(--ink); font-weight:600; white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis}
#mobparty .mp.me{border-color:#5c4a24}
#mobparty .mp.act{border-color:var(--gold)}
#mobparty .mp.down{opacity:.5}
#mobparty .hb{height:4px; background:#2b241c; border-radius:2px; overflow:hidden; margin-top:4px}
#mobparty .hb i{display:block; height:100%; background:linear-gradient(90deg,#8c3a30,#c2564a)}

/* ---- phone & small tablet: sidebar becomes a drawer ---- */
#sheetbtn{display:none}
#scrim{display:none; position:fixed; inset:0; background:#0a0806aa; z-index:39}
@media(max-width:820px){
  .wrap{flex-direction:column}
  #sheetbtn{display:inline-block}
  #sheetclose{display:inline-block !important}
  #mobparty.on{display:flex}
  #side{
    position:fixed; top:0; right:0; bottom:0; z-index:40;
    width:min(340px, 88vw); border-right:none; border-left:1px solid var(--line);
    transform:translateX(105%); transition:transform .22s ease;
    box-shadow:-12px 0 40px #000a;
    padding-bottom:calc(16px + env(safe-area-inset-bottom));
  }
  #side.open{transform:translateX(0)}
  #scrim.on{display:block}
  #log{padding:14px 16px}
  #ctl{padding:10px 12px calc(12px + env(safe-area-inset-bottom))}
  #top{padding-left:max(16px, env(safe-area-inset-left)); padding-right:max(16px, env(safe-area-inset-right))}
  .ch{min-height:44px; padding:10px 14px; font-size:15px; flex:1 1 40%}
  #go{min-height:46px; padding:0 22px}
  #choices{gap:7px}
  h2.scene{font-size:17px}
  #log p{font-size:15px}
  .tb{padding:6px 10px; min-height:32px}
}
@media(max-width:360px){ .ch{flex:1 1 100%} }

/* ---- modal ---- */
#modal{position:fixed; inset:0; background:#0a0806ee; display:none; align-items:center;
  justify-content:center; padding:20px; z-index:50}
#modal.show{display:flex}
#mbox{background:var(--panel); border:1px solid var(--line); border-radius:10px;
  max-width:580px; width:100%; max-height:86vh; overflow-y:auto; padding:26px}
#mbox h3{color:var(--gold); margin:0 0 12px; font-variant:small-caps; letter-spacing:.04em}
#mbox p{font-size:14px; color:#cfc2a8}
#mbox code{background:#120e0a; padding:2px 6px; border-radius:3px; font-size:12px; color:var(--gold)}
#mbox input{background:#120e0a; border:1px solid var(--line); border-radius:5px; color:var(--ink);
  padding:9px 12px; font-family:ui-monospace,Menlo,monospace; font-size:16px; letter-spacing:.2em;
  text-transform:uppercase; width:150px}
.pick{display:grid; gap:8px; margin:14px 0}

/* ---- floating music card ---- */
/* A real embedded YouTube player, one instance per viewer. This only works
   because the game is served over a real https:// origin — YouTube's
   embed needs a genuine Referer/Origin to validate against, which a local
   file:// copy of this page can never send (that mismatch was the actual
   cause of the "error 153" this went through before). Each viewer plays
   the shared track independently with their own play/pause/volume; only
   *which* track is playing is host-controlled and broadcast. */
#ytwrap{position:fixed; right:16px; bottom:16px; width:260px; background:var(--panel);
  border:1px solid var(--line); border-radius:10px; box-shadow:0 6px 24px #0008; z-index:40;
  overflow:hidden}
#ytwrap[hidden]{display:none}
#ythead{display:flex; align-items:center; gap:6px; padding:7px 8px; background:#150f0a;
  border-bottom:1px solid var(--line); cursor:default}
#ytlabel{font-size:12px; color:var(--dim); flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
#ythead .tb{padding:2px 8px; font-size:12px; line-height:1.4}
#ytwrap.min #ytbody{display:none}
#ytwrap.min{width:auto}
#ytbody{padding:10px; font-size:13px}
#ytnote{color:var(--dim); font-size:12px; margin-bottom:8px; line-height:1.5}
#ytnote b{color:var(--ink)}
#ytplayerbox{width:100%; aspect-ratio:16/9; background:#000; border-radius:6px; overflow:hidden; margin-bottom:8px}
#ytplayerbox iframe{width:100%; height:100%; display:block; border:0}
#ytctl{display:flex; align-items:center; gap:8px; margin-bottom:6px}
#ytplay{padding:5px 10px; font-size:12px; background:var(--gold); color:#1a1409; border:none;
  border-radius:6px; font-weight:700; cursor:pointer}
#ytplay:hover{background:#e0b52e}
#ytvol{flex:1}
#ytmsg{font-size:11px; color:var(--dim); line-height:1.5; margin-bottom:6px}
#ytmsg a{color:var(--gold)}
#ytopen{width:100%; background:var(--gold); color:#1a1409; border:none; border-radius:6px;
  padding:9px; font-weight:700; cursor:pointer; font-size:13px}
#ytopen:hover{background:#e0b52e}
#ytchange{background:none; border:none; color:var(--dim); text-decoration:underline;
  font-size:11px; cursor:pointer; font-family:inherit; margin-top:4px; padding:0}
#ytchange:hover{color:var(--ink)}
@media(max-width:820px){ #ytwrap{right:8px; bottom:8px; width:210px} }
</style>
</head>
<body>

<div id="top">
  <span id="ai"><span id="dot"></span><span id="aitxt">Narrator: built-in</span></span>
  <span id="room"></span>
  <span class="sp"></span>
  <button class="tb" id="sheetbtn" onclick="G.drawer()">☰ Sheet</button>
  <button class="tb hot" id="dicebtn" onclick="G.toggleDice()">🎲 Dice Rolls: On</button>
  <button class="tb hot" id="sfxbtn" onclick="G.toggleSfx()">🔊 Sound: On</button>
  <button class="tb" id="musicbtn" onclick="Music.open()">🎵 Music</button>
  <button class="tb" id="mpbtn" onclick="G.multiplayer()">Play with friends</button>
  <button class="tb" id="localaibtn" onclick="G.tryOllama(true)">Connect local AI</button>
  <button class="tb" id="cloudaibtn" onclick="G.tryCloud(true)">Connect cloud AI</button>
  <button class="tb" onclick="G.save()">Save</button>
  <button class="tb" onclick="document.getElementById('file').click()">Load</button>
  <button class="tb" onclick="G.help()">Help</button>
  <input type="file" id="file" hidden accept=".json" onchange="G.load(this)">
</div>

<div class="wrap">
  <aside id="side">
    <button class="tb" id="sheetclose" onclick="G.drawer(false)"
      style="display:none; float:right; margin:-2px -2px 8px 8px">✕ Close</button>
    <div id="partybox" style="display:none">
      <div class="sect" style="margin-top:0">The Party</div>
      <div id="party"></div>
    </div>
    <div id="chatbox" style="display:none">
      <div class="sect">Table Talk</div>
      <div id="chatlog"></div>
      <div id="chatrow">
        <input id="chattxt" maxlength="300" placeholder="say something to the party" autocomplete="off">
        <button id="chatgo">Say</button>
      </div>
    </div>
    <h1 id="pcname">—</h1>
    <div class="sub" id="pcclass">unproven</div>
    <div class="stat"><b>Hit Points</b><span id="hp">—</span></div>
    <div class="bar"><i id="hpbar" style="width:100%"></i></div>
    <div class="stat"><b>Armor Class</b><span id="ac">—</span></div>
    <div class="stat"><b>Level</b><span id="lvl">—</span></div>
    <div class="stat"><b>Experience</b><span id="xp">—</span></div>
    <div class="abils" id="abils"></div>
    <div class="sect">Inventory</div>
    <div id="inv"></div>
    <div class="sect">Journal</div>
    <div id="quest"></div>
  </aside>

  <main id="main">
    <div id="mobparty"></div>
    <div id="log"></div>
    <div id="ctl">
      <div id="turn"></div>
      <div id="choices"></div>
      <div id="inrow">
        <input id="txt" placeholder="…or type what you do" autocomplete="off">
        <button id="go">Act</button>
      </div>
    </div>
  </main>
</div>

<div id="scrim" onclick="G.drawer(false)"></div>
<div id="modal"><div id="mbox"></div></div>

<div id="ytwrap" hidden>
  <div id="ythead">
    <span id="ytlabel">🎵 table music</span>
    <button class="tb" id="ytmin" onclick="Music.toggleMin()" title="Collapse">–</button>
    <button class="tb" id="ytclose" onclick="Music.close()" title="Stop and hide">✕</button>
  </div>
  <div id="ytbody">
    <div id="ytnote"></div>
    <div id="ytplayerbox"><div id="ytplayer"></div></div>
    <div id="ytctl" hidden>
      <button id="ytplay" onclick="Music.toggle()">▶ Play</button>
      <input id="ytvol" type="range" min="0" max="100" value="40" oninput="Music.setVolume(this.value)">
    </div>
    <div id="ytmsg" hidden></div>
    <button id="ytopen" onclick="Music.openTab()" hidden>▶ Open on YouTube instead</button>
    <button id="ytchange" onclick="Music.changeTrack()">change link</button>
  </div>
</div>

<script>
"use strict";
/* ============================================================================
   THE BARROW OF VETHKAR — 1 to 4 players

   ARCHITECTURE
     input -> Parser : text or button -> structured action
           -> Rules  : pure functions, dice, DCs -> GameEvent[]
           -> apply() : the ONLY place state changes
           -> Narrator: reads LOCKED events, writes prose

   MULTIPLAYER
     The host runs the rules engine. Guests send intents and receive state plus
     narration. A guest can edit its own memory all it likes and change nothing,
     because it never rolls anything — the same property that stops the LLM
     cheating also stops a player cheating.

   Uses content from the SRD 5.2.1, (c) Wizards of the Coast, CC-BY-4.0.
============================================================================ */

/* ---------------------------------------------------------------- dice --- */
const R = {
  int:(n)=>Math.floor(Math.random()*n),
  d:(n)=>Math.floor(Math.random()*n)+1,
  dice(n,s){let t=0;for(let i=0;i<n;i++)t+=R.d(s);return t;},
  pick:(a)=>a[Math.floor(Math.random()*a.length)],
  shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=R.int(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;},
  parse(f){
    const m=/^(\d+)d(\d+)([+-]\d+)?$/.exec(f);
    if(!m) return 0;
    return R.dice(+m[1],+m[2]) + (m[3]?+m[3]:0);
  }
};

/* ---------------------------------------------------------------- sfx --- */
// Everything here is synthesized with the Web Audio API — no sound files to
// ship, nothing to load, works fully offline. One shared AudioContext is
// created lazily on first use (browsers refuse to start one before a user
// gesture) and torn tones/short envelopes stand in for dice, steel and bells.
const SFX = {
  on:true, ctx:null,
  ensure(){
    if(this.ctx) return this.ctx;
    try{ this.ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ this.on=false; }
    return this.ctx;
  },
  // one tone: frequency (or an array for a quick arpeggio), duration, shape, gain
  tone(freq, dur, type, gain){
    if(!this.on) return;
    const ctx=this.ensure(); if(!ctx) return;
    if(ctx.state==="suspended") ctx.resume().catch(()=>{});
    const t0=ctx.currentTime;
    const seq=Array.isArray(freq)?freq:[freq];
    const step=dur/seq.length;
    seq.forEach((f,i)=>{
      const osc=ctx.createOscillator(), g=ctx.createGain();
      osc.type=type||"sine"; osc.frequency.value=f;
      const t=t0+i*step;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(gain||0.18, t+0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t+step);
      osc.connect(g); g.connect(ctx.destination);
      osc.start(t); osc.stop(t+step+0.02);
    });
  },
  // a short burst of filtered noise, for dice clatter and misses
  noise(dur, gain){
    if(!this.on) return;
    const ctx=this.ensure(); if(!ctx) return;
    if(ctx.state==="suspended") ctx.resume().catch(()=>{});
    const n=Math.floor(ctx.sampleRate*dur);
    const buf=ctx.createBuffer(1,n,ctx.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
    const src=ctx.createBufferSource(); src.buffer=buf;
    const filt=ctx.createBiquadFilter(); filt.type="bandpass"; filt.frequency.value=1200;
    const g=ctx.createGain(); g.gain.value=gain||0.12;
    src.connect(filt); filt.connect(g); g.connect(ctx.destination);
    src.start();
  },
  diceTick(){ this.noise(0.05, 0.10); },
  diceLand(){ this.noise(0.09, 0.16); this.tone([340,260], 0.09, "square", 0.08); },
  hit(crit){ crit ? this.tone([220,440,660], 0.28, "sawtooth", 0.15) : this.tone([300,220], 0.14, "square", 0.14); },
  miss(){ this.noise(0.12, 0.08); },
  good(){ this.tone([440,560], 0.12, "sine", 0.11); },
  bad(){ this.tone([180,120], 0.16, "sawtooth", 0.13); },
  heal(){ this.tone([392,523,659], 0.32, "sine", 0.12); },
  potion(){ this.tone([523,659], 0.16, "sine", 0.1); },
  levelup(){ this.tone([392,523,659,784], 0.55, "triangle", 0.14); },
  loot(){ this.tone([659,880], 0.16, "sine", 0.1); },
  down(){ this.tone([220,164,110], 0.5, "sawtooth", 0.14); },
  victory(){ this.tone([392,523,659,784,1046], 0.9, "triangle", 0.15); },
  click(){ this.tone(500, 0.05, "square", 0.06); }
};

const Oracle = {
  odds:{certain:5,likely:4,even:3,unlikely:2,remote:1},
  ask(likelihood="even"){
    const bonus=(Oracle.odds[likelihood]??3)-3;
    const r=R.d(6)+bonus;
    if(r<=0) return {yes:false,text:"No, and worse still —"};
    if(r===1) return {yes:false,text:"No, and —"};
    if(r===2) return {yes:false,text:"No."};
    if(r===3) return {yes:false,text:"No, but —"};
    if(r===4) return {yes:true, text:"Yes, but —"};
    if(r===5) return {yes:true, text:"Yes."};
    if(r===6) return {yes:true, text:"Yes, and —"};
    return {yes:true,text:"Yes, and remarkably so —"};
  },
  twist:()=>R.pick(T.twist)
};

      {n:"The Chapter House",    f:"A round room, a round table, and eleven chairs pushed neatly in."},
      {n:"The Reliquary Passage",f:"Niches for saints. The saints have been taken down and stacked."},
      {n:"The Choir",            f:"Stalls facing each other across a flooded aisle. The acoustics are perfect."},
      {n:"The Almonry",          f:"Where the poor were fed. The tables are set. The bowls are full of silt."},
      {n:"The Sea Gate",         f:"A portcullis of green bronze, raised, and jammed with weed."}
    ]
  }
};

/* -------------------------------------------------------------- avatars --- */
